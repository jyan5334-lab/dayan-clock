name: 问题反馈
description: 记录可复现的问题，方便远程维护
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: DAYAN时钟版本
      description: 在顶部设置中查看
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 版本、x64/ARM64、分辨率、显示缩放比例
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图与补充信息
      description: 请勿上传密码、用户配置、访问令牌或系统策略备份。
