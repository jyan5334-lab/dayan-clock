<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小狐闯关记 · 自动通关动画</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b1e;color:#cfc8ee;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:6px;
    box-shadow:0 0 0 2px #2a2452,0 14px 44px rgba(0,0,0,.65)}
  #bar{display:flex;gap:8px;align-items:center;font-size:13px;height:30px}
  #bar span{opacity:.6;margin-left:6px}
  button{font:inherit;color:#e9e4ff;background:#231d47;border:1px solid #40377a;border-radius:6px;
    padding:4px 12px;cursor:pointer}
  button:hover{background:#2e2660}
  button:focus-visible{outline:2px solid #7ef0c0;outline-offset:2px}

html, body { width:100%; height:100%; margin:0!important; overflow:hidden!important; background:#0d0b1e; }
#wrap { width:100%; height:100%; display:block; position:relative; }
#bar { display:none!important; }
#cv { position:absolute!important; inset:0!important; width:100%!important; height:100%!important; max-width:none!important; border:0!important; border-radius:0!important; box-shadow:none!important; object-fit:contain!important; background:linear-gradient(180deg,#0d0b1e 0%,#282047 54%,#342747 100%); image-rendering:pixelated; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="270" aria-label="像素风横版闯关自动演示动画"></canvas>
  <div id="bar">
    <button id="bSound" type="button">🔇 音效：关</button>
    <button id="bPause" type="button">⏸ 暂停</button>
    <button id="bRestart" type="button">↻ 重新开始</button>
    <span>全自动演示 · 空格键暂停</span>
  </div>
</div>

<script>
(() => {
  const context = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
  if (context) {
    context.fillText = () => {};
    context.strokeText = () => {};
  }
  window.AudioContext = undefined;
  window.webkitAudioContext = undefined;
})();
</script>
<script>
(() => {
'use strict';
const HEADLESS = typeof document === 'undefined';
const T = 16, W = 480, H = 270, ROWS = 17, COLS = 228, GY = 14;
const RUN = 2, G_HOLD = 0.17, G_FALL = 0.45, JUMP_V = -5;
// 主角跑到这些 x 坐标时起跳去顶箱子
const JUMPS = [264, 328, 1277, 1325];
const PORTAL_X = 218 * T;

let GEMS = [];
let S = null;
let soundOn = false, AC = null, paused = false;

/* ---------------- 关卡 ---------------- */
function buildGrid() {
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(' '));
  const set = (c, r, ch) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) g[r][c] = ch; };
  const ground = (c0, c1) => { for (let c = c0; c <= c1; c++) for (let r = GY; r < ROWS; r++) set(c, r, '#'); };
  const row = (c0, c1, r, ch) => { for (let c = c0; c <= c1; c++) set(c, r, ch); };
  ground(0, 47); ground(50, 69); ground(73, 109); ground(113, 131); ground(148, COLS - 1);
  // 第一组箱子：宝石箱 + 成长药水
  row(16, 22, 10, 'B'); set(17, 10, 'C'); set(21, 10, 'P');
  // 石阶
  set(56, 13, 'S'); row(57, 57, 13, 'S'); set(57, 12, 'S');
  for (let c = 58; c <= 61; c++) { set(c, 13, 'S'); set(c, 12, 'S'); set(c, 11, 'S'); }
  // 第二组箱子：可击碎木箱 + 烈焰药水
  row(79, 84, 10, 'B'); set(83, 10, 'F');
  // 浮岛
  row(134, 138, 13, '#'); row(141, 145, 12, '#');
  // 石墙
  set(165, 13, 'S'); set(165, 12, 'S'); set(166, 13, 'S'); set(166, 12, 'S');
  return g;
}
function mk(type, col, extra) {
  const e = { type, x: col * T, y: 0, w: 14, h: 12, vx: -0.5, vy: 0, alive: true, active: false, t: 0, dead: 0, deadKind: '' };
  if (type === 'urchin') { e.h = 13; e.vx = -0.4; }
  if (type === 'bat') { e.h = 10; e.vx = -0.8; e.by = GY * T - 30; }
  if (type === 'boss') { e.w = 40; e.h = 30; e.vx = 0; e.hp = 12; e.maxhp = 12; e.awake = false; e.timer = 0; e.hops = 0; e.flash = 0; e.air = false; e.active = true; e.squash = 0; }
  Object.assign(e, extra || {});
  if (type !== 'bat') e.y = GY * T - e.h; else e.y = e.by;
  return e;
}
function makeEnemies() {
  return [
    mk('slime', 13), mk('slime', 40), mk('slime', 45),
    mk('urchin', 96), mk('urchin', 99), mk('bat', 104),
    mk('slime', 119), mk('slime', 121), mk('slime', 123), mk('bat', 127), mk('bat', 130, { by: GY * T - 44 }),
    mk('bat', 141, { by: GY * T - 70 }), mk('bat', 148, { by: GY * T - 60 }),
    mk('urchin', 158), mk('urchin', 161), mk('bat', 172), mk('bat', 176, { by: GY * T - 40 }),
    mk('boss', 200),
  ];
}

function reset(ghost) {
  const enemies = makeEnemies();
  S = {
    grid: buildGrid(), ghost: !!ghost, t: 0, playT: 0, phase: 'intro', phaseT: 0, freeze: 0,
    hero: { x: 36, y: GY * T - 14, w: 10, h: 14, vx: 0, vy: 0, onGround: true, face: 1, power: 0, inv: 0, hold: 0, cool: 0, growT: 0, combo: 0 },
    enemies, boss: enemies[enemies.length - 1], items: [], bolts: [], parts: [], pops: [], bumps: [],
    gems: GEMS.map(g => ({ x: g.x, y: g.y, taken: false })),
    score: 0, gemCount: 0, kills: 0, mi: 0, cam: 0, shake: 0, msg: null,
    portal: { x: PORTAL_X, active: false }, bossDeath: 0, events: [], trace: [],
  };
}
const ev = (name, d) => { if (S.ghost) S.events.push({ f: S.playT, name, x: Math.round(S.hero.x), d }); };
const say = (text, t) => { S.msg = { text, t: t || 120, max: t || 120 }; };

/* ---------------- 物理 ---------------- */
function solid(c, r) {
  if (c < 0 || c >= COLS) return true;
  if (r < 0 || r >= ROWS) return false;
  return S.grid[r][c] !== ' ';
}
function moveBody(b) {
  b.hitWall = 0; b.bump = null;
  b.x += b.vx;
  let c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - 0.01) / T);
  let r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - 0.01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(c, r)) {
    if (b.vx > 0) { b.x = c * T - b.w; b.hitWall = 1; }
    else if (b.vx < 0) { b.x = (c + 1) * T; b.hitWall = -1; }
  }
  b.y += b.vy; b.onGround = false;
  c0 = Math.floor(b.x / T); c1 = Math.floor((b.x + b.w - 0.01) / T);
  r0 = Math.floor(b.y / T); r1 = Math.floor((b.y + b.h - 0.01) / T);
  const cc = Math.floor((b.x + b.w / 2) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(c, r)) {
    if (b.vy > 0) { b.y = r * T - b.h; b.vy = 0; b.onGround = true; }
    else if (b.vy < 0) {
      b.y = (r + 1) * T; b.vy = 0;
      if (!b.bump || c === cc) b.bump = [c, r];
    }
  }
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------------- 自动驾驶 ---------------- */
function ai() {
  const h = S.hero, cx = h.x + h.w / 2, feet = h.y + h.h, boss = S.boss;
  const inp = { dir: 1, jump: false, hold: 0, shoot: false, face: 0 };
  const it = S.items.find(i => i.alive);
  let free = true;
  if (it) {
    free = false;
    const icx = it.x + it.w / 2;
    if (it.state === 'rise' || it.y + it.h < h.y - 1) { inp.dir = cx < icx + 2 ? 1 : 0; inp.face = cx < icx ? 1 : -1; }
    else { const d = icx - cx; inp.dir = d > 2 ? 1 : d < -2 ? -1 : 0; }
  } else if (S.bossDeath > 0) { inp.dir = 0; inp.face = 1; free = false; }
  else if (boss.alive && boss.awake) {
    const d = boss.x - (h.x + h.w);
    inp.dir = d < 110 ? -1 : d > 150 ? 1 : 0; inp.face = 1; free = false;
  }
  if (h.onGround) {
    const m = JUMPS[S.mi];
    if (m !== undefined && cx >= m) {
      if (cx < m + 6) { inp.jump = true; inp.hold = 99; } else ev('missedMarker', m);
      S.mi++;
    }
    if (inp.dir === 1 && !inp.jump) {
      const c = Math.floor((h.x + h.w + 3) / T), r0 = Math.floor((feet + 1) / T);
      let pit = c < COLS;
      for (let r = r0; r < ROWS && pit; r++) if (solid(c, r)) pit = false;
      if (pit) { inp.jump = true; inp.hold = 99; }
      else {
        const cw = Math.floor((h.x + h.w + 18) / T);
        for (let r = Math.floor((h.y + 2) / T); r <= Math.floor((feet - 2) / T); r++)
          if (solid(cw, r)) { inp.jump = true; inp.hold = 99; break; }
      }
    }
    if (!inp.jump) for (const e of S.enemies) {
      if (!e.alive || !e.active || e.type === 'urchin' || e.type === 'boss' || e.type === 'bat') continue;
      const d = e.x + e.w / 2 - cx, closing = h.vx - e.vx;
      if (closing > 0 && d > 0 && d <= closing * 19.5 + 5 && Math.abs(e.y + e.h - feet) < 8) { inp.jump = true; inp.hold = 0; break; }
    }
  }
  if (h.power === 2 && h.cool === 0 && S.bolts.length < 3) for (const e of S.enemies) {
    if (!e.alive || !e.active || (e.type === 'boss' && !e.awake)) continue;
    const d = e.x + e.w / 2 - cx;
    if (d > 0 && d < 170 && Math.abs(e.y + e.h / 2 - (h.y + h.h / 2)) < 70) { inp.shoot = true; break; }
  }
  return inp;
}

/* ---------------- 更新 ---------------- */
function setSize(nh) { const h = S.hero; h.y -= nh - h.h; h.h = nh; }
function hurt() {
  const h = S.hero;
  if (h.power > 0) { h.power = 0; setSize(14); h.inv = 120; S.freeze = 16; ev('hurt'); sfx('hit'); }
  else { S.phase = 'dead'; S.phaseT = 0; h.vy = -5; ev('dead'); sfx('boss'); }
}
function hitBlock(c, r) {
  const ch = S.grid[r][c], h = S.hero;
  const bx = c * T + 8, by = r * T;
  if (ch === 'C') {
    S.grid[r][c] = 'U'; S.gemCount++; S.score += 100; S.bumps.push({ c, r, t: 0 });
    pop(bx, by - 6, '+100'); burst(bx, by - 4, 8, ['#6ef3ff', '#fff', '#2bb7e0'], 2.2); sfx('gem'); ev('gemCrate');
    S.parts.push({ x: bx - 4, y: by - 10, vx: 0, vy: -3.4, g: 0.25, life: 26, max: 26, gem: true });
  } else if (ch === 'P' || ch === 'F') {
    S.grid[r][c] = 'U'; S.bumps.push({ c, r, t: 0 });
    S.items.push({ kind: ch === 'P' ? 'grow' : 'blaze', x: c * T + 2, y: r * T + 2, y0: r * T + 2, w: 12, h: 14, state: 'rise', rt: 0, vx: 0, vy: 0, alive: true });
    sfx('item'); ev('potionOut', ch);
  } else if (ch === 'B') {
    if (h.power >= 1) {
      S.grid[r][c] = ' '; S.score += 50; ev('break');
      burst(bx, by + 8, 10, ['#a86a3d', '#6e3f22', '#d39a5e'], 3, 0.3, 3); sfx('break');
    } else { S.bumps.push({ c, r, t: 0 }); sfx('bump'); }
  } else sfx('bump');
}
function updateHero(inp) {
  const h = S.hero;
  if (h.inv > 0) h.inv--;
  if (h.cool > 0) h.cool--;
  const acc = h.onGround ? 0.2 : 0.12, target = inp.dir * RUN;
  h.vx += Math.max(-acc, Math.min(acc, target - h.vx));
  if (inp.face) h.face = inp.face; else if (inp.dir) h.face = inp.dir;
  const wasGround = h.onGround;
  if (inp.jump && h.onGround) {
    h.vy = JUMP_V; h.hold = inp.hold; sfx('jump');
    burst(h.x + 5, h.y + h.h, 3, ['#cfc8ee'], 0.8, 0.02, 1);
  }
  if (h.vy < 0 && h.hold > 0) { h.vy += G_HOLD; h.hold--; } else { h.vy += G_FALL; h.hold = 0; }
  if (h.vy > 7) h.vy = 7;
  moveBody(h);
  if (h.hitWall) h.vx = 0;
  if (h.bump) hitBlock(h.bump[0], h.bump[1]);
  if (h.onGround && !wasGround) { h.combo = 0; burst(h.x + 5, h.y + h.h, 2, ['#cfc8ee'], 0.6, 0.02, 1); }
  if (h.y > ROWS * T + 30) { h.power = 0; hurt(); return; }
  if (inp.shoot && h.power === 2 && h.cool === 0) {
    S.bolts.push({ x: h.x + (h.face > 0 ? h.w + 2 : -2), y: h.y + h.h / 2 - 2, vx: 5 * h.face, vy: 0, life: 60, dir: h.face });
    h.cool = 16; sfx('shoot'); ev('shoot');
  }
  for (const g of S.gems) {
    if (!g.taken && h.x < g.x + 4 && h.x + h.w > g.x - 4 && h.y < g.y + 4 && h.y + h.h > g.y - 4) {
      g.taken = true; S.gemCount++; S.score += 10; sfx('gem');
      burst(g.x, g.y, 4, ['#6ef3ff', '#fff'], 1.4, 0.02, 1);
    }
  }
}
function updateItems() {
  const h = S.hero;
  for (const it of S.items) {
    if (!it.alive) continue;
    if (it.state === 'rise') {
      it.rt++; it.y = it.y0 - 16 * it.rt / 30;
      if (it.rt >= 30) { it.state = 'move'; it.vx = 1; it.y = it.y0 - 16; }
    } else {
      it.vy = Math.min(it.vy + 0.3, 6);
      const v = it.vx; moveBody(it);
      if (it.hitWall) it.vx = -v;
      if (it.y > ROWS * T + 20) it.alive = false;
    }
    if (it.rt > 12 && overlap(h, it)) {
      it.alive = false; S.score += 1000; S.freeze = 46; h.growT = 46;
      if (it.kind === 'grow') { if (h.power < 1) { h.power = 1; setSize(24); } say('成长药水！变大了', 110); }
      else { h.power = 2; if (h.h < 24) setSize(24); say('烈焰药水！可以发射火花', 130); }
      pop(h.x + 5, h.y - 6, '+1000'); sfx('power'); ev('potion', it.kind);
      burst(h.x + 5, h.y + h.h / 2, 16, it.kind === 'grow' ? ['#56e39f', '#fff', '#b8ffd9'] : ['#ff7a3c', '#ffd166', '#fff'], 2.6, 0.02, 2);
    }
  }
}
function killEnemy(e, kind, pts) {
  e.alive = false; e.dead = kind === 'squish' ? 26 : 14; e.deadKind = kind;
  S.kills++; S.score += pts; pop(e.x + e.w / 2, e.y - 4, '+' + pts);
  const col = e.type === 'slime' ? ['#b05cff', '#e0b8ff', '#7a35c9'] : e.type === 'bat' ? ['#5a60b0', '#3b3f73', '#ffe066'] : ['#8b8fb5', '#2d2a3e', '#ff5470'];
  burst(e.x + e.w / 2, e.y + e.h / 2, kind === 'squish' ? 6 : 10, col, 2.2, 0.12, 2);
}
function updateEnemies() {
  const h = S.hero;
  for (const e of S.enemies) {
    if (!e.alive) { if (e.dead > 0) e.dead--; continue; }
    if (!e.active) { if (e.x - h.x < 300) e.active = true; else continue; }
    e.t++;
    if (e.type === 'bat') {
      e.x += e.vx; const p = (e.t % 80) / 80; e.y = e.by + 10 * (4 * Math.abs(p - 0.5) - 1);
      if (e.x < h.x - 300) e.alive = false;
    } else if (e.type === 'boss') {
      if (!e.awake) {
        if (e.x - h.x < 230) { e.awake = true; say('BOSS 史莱姆王 出现！', 150); sfx('boss'); ev('bossAwake'); }
        else continue;
      }
      e.timer++; if (e.flash > 0) e.flash--; if (e.squash > 0) e.squash--;
      const period = e.hp <= e.maxhp / 2 ? 44 : 70;
      if (e.onGround) {
        e.vx = 0;
        if (e.timer >= period) { e.vy = -4.6; e.vx = (h.x < e.x ? -1 : 1) * 1.1; e.timer = 0; e.hops++; }
      }
      e.vy = Math.min(e.vy + 0.3, 6);
      moveBody(e);
      if (e.onGround && e.air) {
        S.shake = 9; e.squash = 10; sfx('bump');
        burst(e.x + 4, e.y + e.h, 5, ['#cfc8ee'], 1.6, 0.03, 2); burst(e.x + e.w - 4, e.y + e.h, 5, ['#cfc8ee'], 1.6, 0.03, 2);
        if (e.hops % 2 === 0 && S.enemies.filter(m => m.minion && m.alive).length < 3) {
          const m = mk('slime', 0, { vx: -0.9, minion: true, active: true }); m.x = e.x - 16; S.enemies.push(m);
        }
      }
      e.air = !e.onGround;
    } else {
      e.vy = Math.min(e.vy + 0.3, 6);
      const v = e.vx; moveBody(e);
      if (e.hitWall) e.vx = -v;
      if (e.y > ROWS * T + 20 || e.x < h.x - 320) e.alive = false;
    }
  }
  for (const e of S.enemies) {
    if (!e.alive || !e.active || !overlap(h, e)) continue;
    if (e.type !== 'urchin' && e.type !== 'boss' && h.vy > 0 && h.y + h.h < e.y + e.h * 0.75 + 2) {
      h.combo++; killEnemy(e, 'squish', 100 * Math.min(h.combo, 8));
      h.vy = -3.8; h.hold = 0; sfx('stomp'); ev('stomp', e.type);
    } else if (h.inv === 0) { ev('touch', e.type); hurt(); if (S.phase !== 'play') return; }
  }
}
function bossDie(e) {
  e.alive = false; e.dead = 0; S.bossDeath = 110; S.kills++; S.score += 5000; S.shake = 14;
  say('击败史莱姆王！', 140); sfx('boss'); ev('bossDead');
  for (const m of S.enemies) if (m.minion && m.alive) killEnemy(m, 'pop', 200);
}
function updateBolts() {
  for (const b of S.bolts) {
    b.life--;
    let best = null, bd = 220;
    for (const e of S.enemies) {
      if (!e.alive || !e.active || (e.type === 'boss' && !e.awake)) continue;
      const d = (e.x + e.w / 2 - b.x) * b.dir;
      if (d > -4 && d < bd) { bd = d; best = e; }
    }
    if (best) {
      const want = Math.max(-2.5, Math.min(2.5, (best.y + best.h / 2 - b.y) * 0.15));
      b.vy += Math.max(-0.5, Math.min(0.5, want - b.vy));
    }
    b.x += b.vx; b.y += b.vy;
    if (solid(Math.floor(b.x / T), Math.floor(b.y / T))) { b.life = 0; burst(b.x, b.y, 4, ['#ffd166', '#ff7a3c'], 1.5, 0.05, 1); continue; }
    for (const e of S.enemies) {
      if (!e.alive || !e.active) continue;
      if (b.x > e.x - 4 && b.x < e.x + e.w + 4 && b.y > e.y - 4 && b.y < e.y + e.h + 4) {
        b.life = 0; burst(b.x, b.y, 6, ['#ffd166', '#ff7a3c', '#fff'], 2, 0.05, 2); sfx('hit');
        if (e.type === 'boss') {
          if (!e.awake) break;
          e.hp--; e.flash = 6; S.score += 50; ev('bossHit', e.hp);
          if (e.hp <= 0) bossDie(e);
        } else { killEnemy(e, 'pop', 200); ev('shot', e.type); }
        break;
      }
    }
  }
  S.bolts = S.bolts.filter(b => b.life > 0);
}
function updateFx() {
  if (S.msg && --S.msg.t <= 0) S.msg = null;
  if (S.shake > 0) S.shake--;
  for (const b of S.bumps) b.t++;
  S.bumps = S.bumps.filter(b => b.t < 10);
  for (const p of S.parts) { p.life--; p.vy += p.g; p.x += p.vx; p.y += p.vy; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const p of S.pops) { p.t++; p.y -= 0.5; }
  S.pops = S.pops.filter(p => p.t < 50);
}
function burst(x, y, n, cols, sp, g, size) {
  if (S.ghost || HEADLESS) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = sp * (0.4 + Math.random() * 0.6), life = 18 + Math.random() * 16 | 0;
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, g: g === undefined ? 0.08 : g, life, max: life, c: cols[i % cols.length], s: size || 1 });
  }
}
function pop(x, y, text) { if (!S.ghost && !HEADLESS) S.pops.push({ x, y, text, t: 0 }); }

function step() {
  S.t++;
  updateFx();
  const h = S.hero;

  if (air) { P(1, hh - legH - 1, 3, legH, dark); P(9, hh - legH - 1, 3, legH, dark); }
  else if (run) { P(stepK ? 2 : 4, hh - legH - (stepK ? 0 : 1), 3, legH + (stepK ? 0 : 0), dark); P(stepK ? 9 : 7, hh - legH - (stepK ? 1 : 0), 3, legH, dark); }
  else { P(3, hh - legH, 3, legH, dark); P(8, hh - legH, 3, legH, dark); }
  // 身体
  P(2, by, 9, bodyH, fur); P(5, by + 1, 5, bodyH - 1, cream);
  if (big) { const a = air ? -2 : run ? (stepK ? 1 : -1) : 0; P(9, by + 3 + a, 3, 2, fur); P(11, by + 3 + a, 2, 2, dark); }
  // 围巾
  P(3, by - 1, 9, 2, scarf); P(3, by + 1, 2, 1, scarf2); P(run || air ? -2 : 1, by - 1 + wag, 4, 2, scarf); P(run || air ? -4 : 0, by + wag, 2, 2, scarf2);
  // 头
  P(3, 0, 10, 8, fur); P(3, -3, 3, 3, fur); P(9, -3, 3, 3, fur); P(4, -2, 1, 2, ink); P(10, -2, 1, 2, ink);
  P(3, 5, 4, 3, cream); P(9, 4, 5, 3, cream); P(13, 4, 1, 1, ink);
  P(9, 1, 2, 3, ink); P(10, 1, 1, 1, '#fff');
  if (power === 2 && S.t % 4 === 0 && S.freeze === 0) S.parts.push({ x: h.x + 5 - face * 6, y: h.y + 10 + Math.random() * 8, vx: -face * 0.3, vy: -0.4, g: -0.01, life: 14, max: 14, c: Math.random() < 0.5 ? '#ff7a3c' : '#ffd166', s: 1 });
}
function drawPortal() {
  const p = S.portal, x = p.x, y = GY * T - 46, t = S.t;
  // 内部
  if (p.active) {
    const pal = ['#2b1b6e', '#4b3bd0', '#6ef3ff', '#b8fbff', '#6ef3ff', '#4b3bd0'];
    for (let i = 0; i < 38; i++) { const w = i < 6 ? 10 + i * 2 : 22; R(x + 16 - w / 2, y + 8 + i, w, 1, pal[(i + Math.floor(t / 3)) % pal.length]); }
    for (let i = 0; i < 6; i++) { const a = t / 14 + i * 1.05, rr = 3 + (i * 3 + t / 6) % 10; R(Math.round(x + 16 + Math.cos(a) * rr), Math.round(y + 26 + Math.sin(a) * rr * 1.5), 2, 2, '#fff'); }
    ctx.globalAlpha = 0.18 + 0.08 * Math.sin(t / 9); R(x - 6, y - 2, 44, 50, '#6ef3ff'); ctx.globalAlpha = 1;
    if (t % 5 === 0) S.parts.push({ x: x + 6 + Math.random() * 20, y: y + 44, vx: 0, vy: -0.8 - Math.random(), g: 0, life: 30, max: 30, c: '#b8fbff', s: 1 });
  } else { for (let i = 0; i < 38; i++) { const w = i < 6 ? 10 + i * 2 : 22; R(x + 16 - w / 2, y + 8 + i, w, 1, '#1b1533'); } }
  // 石拱
  R(x, y + 10, 5, 36, '#6f6a8c'); R(x + 27, y + 10, 5, 36, '#6f6a8c'); R(x + 2, y + 5, 28, 5, '#6f6a8c'); R(x + 6, y + 1, 20, 5, '#6f6a8c'); R(x + 11, y - 2, 10, 4, '#6f6a8c');
  R(x, y + 10, 1, 36, '#a5a0c4'); R(x + 27, y + 10, 1, 36, '#a5a0c4'); R(x + 6, y + 1, 20, 1, '#a5a0c4'); R(x + 11, y - 2, 10, 1, '#a5a0c4');
  R(x + 4, y + 10, 1, 36, '#474363'); R(x + 31, y + 10, 1, 36, '#474363');
  R(x - 2, y + 42, 9, 4, '#57527a'); R(x + 25, y + 42, 9, 4, '#57527a');
  R(x + 14, y, 4, 4, p.active ? '#6ef3ff' : '#474363'); R(x + 1, y + 20, 3, 3, p.active ? '#6ef3ff' : '#474363'); R(x + 28, y + 20, 3, 3, p.active ? '#6ef3ff' : '#474363');
}

function draw() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const cam = Math.round(S.cam);
  drawBG(cam);
  const shx = S.shake > 0 ? ((S.t % 2) * 2 - 1) * Math.ceil(S.shake / 4) : 0, shy = S.shake > 0 ? (((S.t >> 1) % 2) * 2 - 1) * Math.ceil(S.shake / 5) : 0;
  ctx.save(); ctx.translate(-cam + shx, shy);
  drawPortal();
  const c0 = Math.max(0, Math.floor(cam / T) - 1), c1 = Math.min(COLS - 1, c0 + 33);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = S.grid[r][c]; if (ch === ' ') continue;
    let oy = 0; for (const b of S.bumps) if (b.c === c && b.r === r) oy = -[0, 3, 5, 6, 5, 4, 3, 2, 1, 0][b.t];
    drawTile(ch, c, r, c * T, r * T + oy);
  }
  for (const g of S.gems) if (!g.taken && g.x > cam - 10 && g.x < cam + W + 10) drawGem(g.x, g.y, S.t + g.x);
  for (const it of S.items) if (it.alive) {
    if (it.state === 'rise') { ctx.save(); ctx.beginPath(); ctx.rect(it.x - 2, it.y0 - 34, 16, 32); ctx.clip(); drawPotion(it.x, it.y, it.kind, S.t); ctx.restore(); }
    else drawPotion(it.x, it.y, it.kind, S.t);
  }
  for (const e of S.enemies) {
    if (e.x < cam - 60 || e.x > cam + W + 40) continue;
    if (!e.alive && e.dead <= 0) continue;
    if (e.type === 'slime') drawSlime(e); else if (e.type === 'urchin') drawUrchin(e); else if (e.type === 'bat') drawBat(e); else drawBoss(e);
  }
  drawHero();
  for (const b of S.bolts) {
    const x = Math.round(b.x), y = Math.round(b.y), k = S.t % 4 < 2;
    R(x - 6 * b.dir - 2, y - 1, 4, 2, '#ff7a3c'); R(x - 3 * b.dir - 2, y - 2, 4, 4, '#ffb347');
    R(x - 2, y - 2, 4, 4, '#fff3b0'); if (k) { R(x - 1, y - 4, 2, 8, '#ffd166'); R(x - 4, y - 1, 8, 2, '#ffd166'); } else { R(x - 3, y - 3, 6, 6, '#ffd166'); R(x - 1, y - 1, 2, 2, '#fff'); }
  }
  for (const p of S.parts) {
    if (p.gem) { drawGem(Math.round(p.x) + 4, Math.round(p.y) + 4, S.t * 2); continue; }
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); R(Math.round(p.x), Math.round(p.y), p.s, p.s, p.c);
  }
  ctx.globalAlpha = 1;
  for (const p of S.pops) { ctx.globalAlpha = Math.min(1, (50 - p.t) / 20); text(p.text, Math.round(p.x), Math.round(p.y), 7, '#fff8dc', 'center'); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}
function drawHUD() {
  return;
  const h = S.hero;
  ctx.globalAlpha = 0.55; R(0, 0, W, 18, '#0d0b1e'); ctx.globalAlpha = 1;
  text('得分 ' + String(S.score).padStart(6, '0'), 8, 10, 9, '#fff8dc');
  drawGem(104, 9, S.t); text('× ' + String(S.gemCount).padStart(2, '0'), 112, 10, 9, '#b8fbff');
  text('击败 ' + S.kills, 158, 10, 9, '#ffb3c7');
  const form = h.power === 2 ? ['烈焰形态', '#ffb347'] : h.power === 1 ? ['成长形态', '#7ef0c0'] : ['普通形态', '#cfc8ee'];
  text(form[0], 240, 10, 9, form[1], 'center');
  text('第 1 关 · 暮色森林', 330, 10, 9, '#cfc8ee', 'center');
  text('时间 ' + (S.playT / 60).toFixed(1), W - 8, 10, 9, '#fff8dc', 'right');
  // 关卡进度条
  const pr = Math.max(0, Math.min(1, (h.x - 36) / (PORTAL_X - 36)));
  ctx.globalAlpha = 0.5; R(140, H - 9, 200, 3, '#0d0b1e'); ctx.globalAlpha = 1;
  R(140, H - 9, Math.round(200 * pr), 3, '#7ef0c0'); R(139 + Math.round(200 * pr), H - 11, 3, 7, '#f28c38'); R(341, H - 12, 2, 9, '#6ef3ff');
  // BOSS 血条
  const b = S.boss;
  if (b.awake && (b.alive || S.bossDeath > 60)) {
    text('史莱姆王', W / 2, 30, 9, '#ffc2d6', 'center');
    R(W / 2 - 71, 37, 142, 7, '#0d0b1e'); R(W / 2 - 70, 38, 140, 5, '#3a1630');
    R(W / 2 - 70, 38, Math.round(140 * Math.max(0, b.hp) / b.maxhp), 5, b.hp <= b.maxhp / 2 ? '#ff4d5e' : '#e0457b'); R(W / 2 - 70, 38, Math.round(140 * Math.max(0, b.hp) / b.maxhp), 1, '#ffc2d6');
  }
  if (S.msg && S.phase === 'play') {
    const a = Math.min(1, S.msg.t / 20, (S.msg.max - S.msg.t) / 8 + 0.2);
    ctx.globalAlpha = a; const y = b.awake && b.alive ? 62 : 52;
    ctx.font = 'bold 12px ' + FONT; const w = ctx.measureText(S.msg.text).width + 20;
    ctx.globalAlpha = a * 0.6; R(W / 2 - w / 2, y - 10, w, 20, '#0d0b1e'); ctx.globalAlpha = a;
    text(S.msg.text, W / 2, y, 12, '#fff8dc', 'center'); ctx.globalAlpha = 1;
  }
  if (S.phase === 'intro') {
    const a = Math.min(1, (100 - S.phaseT) / 20);
    ctx.globalAlpha = a * 0.6; R(0, 78, W, 84, '#0d0b1e'); ctx.globalAlpha = a;
    text('小狐闯关记', W / 2, 108, 26, '#ffd166', 'center');
    text('踩怪 · 喝药水 · 打 BOSS —— 全自动通关演示', W / 2, 138, 10, '#cfc8ee', 'center');
    ctx.globalAlpha = 1;
  }
  if (S.phase === 'clear') {
    const a = Math.min(1, S.phaseT / 30);
    ctx.globalAlpha = a * 0.72; R(110, 62, 260, 150, '#0d0b1e'); ctx.globalAlpha = a;
    R(110, 62, 260, 2, '#ffd166'); R(110, 210, 260, 2, '#ffd166');
    text('通 关 ！', W / 2, 90, 26, '#ffd166', 'center');
    const rows = [['得分', String(S.score)], ['宝石', '× ' + S.gemCount], ['击败怪物', String(S.kills)], ['用时', (S.playT / 60).toFixed(1) + ' 秒']];
    rows.forEach((r, i) => { if (S.phaseT > 50 + i * 25) { text(r[0], 170, 122 + i * 18, 11, '#cfc8ee'); text(r[1], 310, 122 + i * 18, 11, '#fff8dc', 'right'); } });
    if (S.phaseT > 200) text('稍后自动重新开始…', W / 2, 198, 8, '#8f88b8', 'center');
    ctx.globalAlpha = 1;
  }
  if (S.phase === 'dead') text('哎呀！重新来过…', W / 2, 120, 14, '#ffb3c7', 'center');
  if (paused) { ctx.globalAlpha = 0.5; R(0, 0, W, H, '#0d0b1e'); ctx.globalAlpha = 1; text('已暂停', W / 2, H / 2, 18, '#fff8dc', 'center'); }
}

/* ---------------- 主循环 ---------------- */
planGems();
reset(false);
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(100, now - lastT); lastT = now;
  if (!paused) { acc += dt; let n = 0; while (acc >= 1000 / 60 && n++ < 5) { step(); acc -= 1000 / 60; } if (n >= 5) acc = 0; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const bSound = document.getElementById('bSound'), bPause = document.getElementById('bPause');
bSound.addEventListener('click', () => {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    soundOn = !soundOn;
  } catch (e) { soundOn = false; }
  bSound.textContent = soundOn ? '🔊 音效：开' : '🔇 音效：关';
  if (soundOn) sfx('gem');
});
function togglePause() { paused = !paused; bPause.textContent = paused ? '▶ 继续' : '⏸ 暂停'; }
bPause.addEventListener('click', togglePause);
document.getElementById('bRestart').addEventListener('click', () => { reset(false); if (paused) togglePause(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); togglePause(); } });
})();
</script>
