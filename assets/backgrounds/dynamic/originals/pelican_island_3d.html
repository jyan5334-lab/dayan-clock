<style>

<!-- 引导脚本：并行探测多个 CDN，选最快的一个生成 importmap，再启动主程序（国内网络也能正常加载） -->
<script>
(function () {
  var VER = '0.170.0';
  var CDNS = [
    'https://cdn.jsdelivr.net/npm/three@' + VER + '/',
    'https://registry.npmmirror.com/three/' + VER + '/files/',
    'https://unpkg.com/three@' + VER + '/'
  ];
  var statusEl = document.getElementById('load-status');
  window.__showError = function (msg) {
    var l = document.getElementById('loader');
    l.classList.remove('hide');
    l.querySelector('.spin').style.display = 'none';
    statusEl.style.color = '#ffb0a0';
    statusEl.textContent = msg;
  };
  window.addEventListener('error', function (e) {
    if (!window.__appReady) window.__showError('运行出错：' + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!window.__appReady) window.__showError('运行出错：' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  function probe(base) {
    return new Promise(function (resolve, reject) {
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, 9000);
      fetch(base + 'package.json', ctl ? { signal: ctl.signal } : {}).then(function (r) {
        clearTimeout(timer); r.ok ? resolve(base) : reject(new Error('HTTP ' + r.status));
      }, function (err) { clearTimeout(timer); reject(err); });
    });
  }
  function start(base) {
    statusEl.textContent = '正在加载 Three.js …\n' + base.replace(/^https:\/\//, '').split('/')[0];
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: {
      'three': base + 'build/three.module.min.js',
      'three/addons/': base + 'examples/jsm/'
    } });
    document.head.appendChild(im);
    var s = document.createElement('script');
    s.type = 'module';
    s.textContent = document.getElementById('app-src').textContent;
    s.onerror = function () { window.__showError('Three.js 模块加载失败，请检查网络后刷新页面。'); };
    document.body.appendChild(s);
    setTimeout(function () {
      if (!window.__appStarted) window.__showError('加载超时：无法从 CDN 获取 Three.js。\n请检查网络连接（或代理设置）后刷新页面。');
    }, 45000);
  }
  var any = Promise.any ? Promise.any.bind(Promise) : function (ps) {
    return new Promise(function (res, rej) { var n = ps.length; ps.forEach(function (p) { p.then(res, function () { if (--n === 0) rej(); }); }); });
  };
  any(CDNS.map(probe)).then(start, function () { start(CDNS[0]); });
})();
</script>

<!-- 主程序（由上面的引导脚本以 ES Module 方式执行） -->
<script type="text/x-app-module" id="app-src">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

window.__appStarted = true;
const statusEl = document.getElementById('load-status');
statusEl.textContent = '正在程序化生成场景 …';

/* =====================================================================
 *  基础工具
 * ===================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, lambda, dt) => lerp(cur, target, 1 - Math.exp(-lambda * dt));
const wrapPi = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);

let _seed = 20241120;
const rand = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length) % arr.length];

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

/* ---------- 几何工具 ---------- */
// 给几何体整体上色（顶点色），便于合并成单个网格
function tint(geo, color) {
  const c = new THREE.Color(color);
  const n = geo.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
// 合并几何体（统一转为非索引，保留 position / normal / color）
function mergeGeos(list) {
  let total = 0;
  const parts = list.map((g) => {
    const ng = g.index ? g.toNonIndexed() : g;
    if (!ng.attributes.normal) ng.computeVertexNormals();
    total += ng.attributes.position.count;
    return ng;
  });
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  let o = 0;
  for (const g of parts) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array.subarray(0, n * 3), o * 3);
    nor.set(g.attributes.normal.array.subarray(0, n * 3), o * 3);
    if (g.attributes.color) col.set(g.attributes.color.array.subarray(0, n * 3), o * 3);
    else col.fill(1, o * 3, (o + n) * 3);
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}
const _qa = new THREE.Quaternion(), _m4 = new THREE.Matrix4(), _va = V3(), _vb = V3(), _vc = V3();
// 两点之间的圆柱（几何体，已变换），r1 在 a 端，r2 在 b 端
function cylGeo(a, b, r1, r2 = r1, seg = 12, open = false) {
  const dir = _va.subVectors(b, a); const len = dir.length();
  const g = new THREE.CylinderGeometry(r2, r1, len, seg, 1, open);
  _qa.setFromUnitVectors(UP, dir.clone().normalize());
  _m4.compose(_vb.copy(a).addScaledVector(dir, 0.5), _qa, _vc.set(1, 1, 1));
  g.applyMatrix4(_m4);
  return g;
}
function cylMesh(a, b, r1, r2, mat, seg = 12) {
  const m = new THREE.Mesh(cylGeo(a, b, r1, r2, seg), mat);
  m.castShadow = true;
  return m;
}
function placeGeo(g, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  _m4.compose(_va.set(x, y, z), _qa.setFromEuler(new THREE.Euler(rx, ry, rz)), _vb.set(sx, sy, sz));
  return g.applyMatrix4(_m4);

/* ---------- 放样（Loft）：沿中心线以可变截面生成管状曲面，可逐帧更新 ---------- */
const _T = V3(), _N = V3(), _B = V3(), _prevN = V3(1, 0, 0);
class Loft {
  constructor(rings, radial, capStart = true, capEnd = true) {
    this.rings = rings; this.radial = radial; this.capStart = capStart; this.capEnd = capEnd;
    const vCount = rings * radial + (capStart ? 1 : 0) + (capEnd ? 1 : 0);
    this.pos = new Float32Array(vCount * 3);
    const idx = [];
    for (let i = 0; i < rings - 1; i++) for (let j = 0; j < radial; j++) {
      const a = i * radial + j, b = i * radial + ((j + 1) % radial), c = a + radial, d = b + radial;
      idx.push(a, c, b, b, c, d);
    }
    let k = rings * radial;
    if (capStart) { this.sIdx = k++; for (let j = 0; j < radial; j++) idx.push(this.sIdx, j, (j + 1) % radial); }
    if (capEnd) { this.eIdx = k++; const o = (rings - 1) * radial; for (let j = 0; j < radial; j++) idx.push(this.eIdx, o + ((j + 1) % radial), o + j); }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.geo.setIndex(idx);
    this.sec = [0, 0];
  }
  // centers: Vector3[rings]；up: Vector3 或 Vector3[]（截面的“上”方向）；section(t, ang, out, i) 写入截面坐标 [x(侧), y(上)]
  update(centers, up, section) {
    const { rings, radial, pos, sec } = this;
    _prevN.set(0, 0, 0);
    for (let i = 0; i < rings; i++) {
      const a = centers[Math.max(0, i - 1)], b = centers[Math.min(rings - 1, i + 1)];
      _T.subVectors(b, a).normalize();
      const u = Array.isArray(up) ? up[i] : up;
      _N.copy(u).addScaledVector(_T, -u.dot(_T));
      if (_N.lengthSq() < 1e-10) _N.copy(_prevN);
      _N.normalize(); _prevN.copy(_N);
      _B.crossVectors(_T, _N);
      const t = i / (rings - 1), c = centers[i];
      for (let j = 0; j < radial; j++) {
        section(t, (j / radial) * TAU, sec, i);
        const k = (i * radial + j) * 3;
        pos[k] = c.x + _B.x * sec[0] + _N.x * sec[1];
        pos[k + 1] = c.y + _B.y * sec[0] + _N.y * sec[1];
        pos[k + 2] = c.z + _B.z * sec[0] + _N.z * sec[1];
      }
    }
    if (this.capStart) { const c = centers[0], k = this.sIdx * 3; pos[k] = c.x; pos[k + 1] = c.y; pos[k + 2] = c.z; }
    if (this.capEnd) { const c = centers[rings - 1], k = this.eIdx * 3; pos[k] = c.x; pos[k + 1] = c.y; pos[k + 2] = c.z; }

    this.geo.computeVertexNormals();
    return this.geo;
  }
}
// 一次性放样：centerFn(t) -> Vector3
function loftGeo(rings, radial, centerFn, up, section, caps = [true, true]) {
  const L = new Loft(rings, radial, caps[0], caps[1]);
  const centers = [];
  for (let i = 0; i < rings; i++) centers.push(centerFn(i / (rings - 1)));
  L.update(centers, up, section);
  L.geo.computeBoundingSphere();
  return L.geo;
}
// 椭圆截面工厂：radFn(t) -> [rx, ry, oy]
const ellipse = (radFn) => (t, ang, out) => {
  const r = radFn(t);
  out[0] = Math.cos(ang) * r[0];
  out[1] = Math.sin(ang) * r[1] + (r[2] || 0);
};
// 用正交基设置物体朝向：X 轴沿 dir，Y 轴尽量靠近 upHint
const _bx = V3(), _by = V3(), _bz = V3();
function basisQuat(dir, upHint, out = new THREE.Quaternion()) {
  _bx.copy(dir).normalize();
  _bz.crossVectors(_bx, upHint);
  if (_bz.lengthSq() < 1e-10) _bz.set(0, 0, 1);
  _bz.normalize();
  _by.crossVectors(_bz, _bx);
  _m4.makeBasis(_bx, _by, _bz);
  return out.setFromRotationMatrix(_m4);
}
// 同上，但 Y 轴沿 dir（用于 CylinderGeometry 等沿 Y 建模的骨骼）
function basisQuatY(dir, sideHint, out = new THREE.Quaternion()) {
  _by.copy(dir).normalize();
  _bx.crossVectors(_by, sideHint);
  if (_bx.lengthSq() < 1e-10) _bx.set(1, 0, 0);
  _bx.normalize();
  _bz.crossVectors(_bx, _by);
  _m4.makeBasis(_bx, _by, _bz);
  return out.setFromRotationMatrix(_m4);
}
// 两骨骼 IK：根 a、目标 t、骨长 l1 l2、极向量 pole（关节弯曲朝向），结果写入 outJoint
function solveIK2(a, t, l1, l2, pole, outJoint) {
  const d = _va.subVectors(t, a);
  let dist = d.length();
  const dn = d.clone().divideScalar(dist || 1);
  dist = clamp(dist, Math.abs(l1 - l2) + 1e-4, l1 + l2 - 1e-4);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const sinA = Math.sqrt(1 - cosA * cosA);
  const pv = _vb.copy(pole).addScaledVector(dn, -pole.dot(dn));
  if (pv.lengthSq() < 1e-10) pv.set(0, 1, 0);
  pv.normalize();
  return outJoint.copy(a).addScaledVector(dn, l1 * cosA).addScaledVector(pv, l1 * sinA);

/* =====================================================================
 *  道路：闭合样条 + 弧长查找表（位置 / 航向 / 曲率）
 * ===================================================================== */
const WATER_Y = -0.9;
const ROAD_HALF = 1.75;
const roadCurve = new THREE.CatmullRomCurve3([
  [0, -36], [30, -39], [57, -33], [73, -14], [76, 10], [65, 33], [42, 45], [17, 43],
  [-6, 36], [-29, 44], [-55, 41], [-73, 22], [-77, -6], [-63, -28], [-34, -38],
].map(([x, z]) => V3(x, 0, z)), true, 'centripetal');
roadCurve.arcLengthDivisions = 3000;
const ROAD_LEN = roadCurve.getLength();
const NS = 3000, DS = ROAD_LEN / NS;
const RX = new Float32Array(NS), RZ = new Float32Array(NS), RH = new Float32Array(NS), RK = new Float32Array(NS);
for (let i = 0; i < NS; i++) { const p = roadCurve.getPointAt(i / NS); RX[i] = p.x; RZ[i] = p.z; }
for (let i = 0; i < NS; i++) {
  const a = (i - 1 + NS) % NS, b = (i + 1) % NS;
  RH[i] = Math.atan2(-(RZ[b] - RZ[a]), RX[b] - RX[a]);   // 航向（绕 +Y，+X 为 0）
}
{
  const raw = new Float32Array(NS);
  for (let i = 0; i < NS; i++) raw[i] = wrapPi(RH[(i + 1) % NS] - RH[(i - 1 + NS) % NS]) / (2 * DS);
  const W = 18;
  for (let i = 0; i < NS; i++) { let s = 0; for (let k = -W; k <= W; k++) s += raw[(i + k + NS) % NS]; RK[i] = s / (2 * W + 1); }
}
// 按弧长 s 采样道路（线性插值）
function roadSample(s, out) {
  s = ((s % ROAD_LEN) + ROAD_LEN) % ROAD_LEN;
  const f = s / DS, i = Math.floor(f) % NS, j = (i + 1) % NS, t = f - Math.floor(f);
  out.x = lerp(RX[i], RX[j], t); out.z = lerp(RZ[i], RZ[j], t);
  out.h = RH[i] + wrapPi(RH[j] - RH[i]) * t;
  out.k = lerp(RK[i], RK[j], t);
  return out;
}
// 道路距离场（空间网格加速）
const RD_CELL = 8, rdGrid = new Map();
const rdKey = (cx, cz) => (cx + 2000) * 8192 + (cz + 2000);
const SEGSTEP = 4;
for (let i = 0; i < NS; i += SEGSTEP) {
  const j = (i + SEGSTEP) % NS;
  const x0 = Math.min(RX[i], RX[j]), x1 = Math.max(RX[i], RX[j]), z0 = Math.min(RZ[i], RZ[j]), z1 = Math.max(RZ[i], RZ[j]);
  for (let cx = Math.floor(x0 / RD_CELL); cx <= Math.floor(x1 / RD_CELL); cx++)
    for (let cz = Math.floor(z0 / RD_CELL); cz <= Math.floor(z1 / RD_CELL); cz++) {
      const k = rdKey(cx, cz); if (!rdGrid.has(k)) rdGrid.set(k, []); rdGrid.get(k).push(i);
    }
}
function roadDist(x, z) {
  const cx = Math.floor(x / RD_CELL), cz = Math.floor(z / RD_CELL);
  let best = 1e9;
  for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) {
    const arr = rdGrid.get(rdKey(cx + a, cz + b)); if (!arr) continue;
    for (const i of arr) {
      const j = (i + SEGSTEP) % NS;
      const ax = RX[i], az = RZ[i], bx = RX[j] - ax, bz = RZ[j] - az;
      const t = clamp(((x - ax) * bx + (z - az) * bz) / (bx * bx + bz * bz), 0, 1);
      const dx = x - ax - bx * t, dz = z - az - bz * t, d2 = dx * dx + dz * dz;
      if (d2 < best) best = d2;
    }
  }
  return best === 1e9 ? 99 : Math.sqrt(best);
}

/* =====================================================================
 *  地形：海岸、丘陵、远山、灯塔岬角；道路附近压平
 * ===================================================================== */
const shoreZ = (x) => -57 + 5 * Math.sin(x * 0.031 + 0.4) + 3 * Math.sin(x * 0.083 + 1.7);
const LH = { x: 90, z: -63 };    // 灯塔岬角
function naturalHeight(x, z) {
  const dz = z - shoreZ(x);
  let h = dz >= 0 ? WATER_Y + 0.08 + 1.05 * (1 - Math.exp(-dz / 8)) : Math.max(WATER_Y + 0.08 + dz * 0.075, -7);
  const inland = smooth(6, 40, dz);
  h += inland * ((fbm(x * 0.011, z * 0.011, 4) - 0.45) * 8 + smooth(50, 200, z) * 32 * (0.55 + 0.7 * fbm(x * 0.006 + 3, z * 0.006, 3)));
  const hx = x - LH.x, hz = z - LH.z;
  h += 7.5 * Math.exp(-(hx * hx + hz * hz) / (2 * 14 * 14)) * (0.85 + 0.3 * fbm(x * 0.15, z * 0.15, 2));
  if (dz > 10) h = Math.max(h, WATER_Y + 0.55 + Math.min(dz - 10, 30) * 0.02);
  const r = Math.hypot(x, z);
  h += smooth(380, 850, r) * (30 + 110 * fbm(x * 0.0042, z * 0.0042, 4)) * smooth(-260, 60, z);
  return h;
}
function groundY(x, z) {
  const hn = naturalHeight(x, z);
  const d = roadDist(x, z);
  return lerp(-0.06, hn, smooth(ROAD_HALF + 0.5, ROAD_HALF + 13, d));
}

function addGrain(mat, scale = 1.7, amt = 0.24, extraFrag = '') {
  mat.customProgramCacheKey = () => 'grain|' + scale + '|' + amt + '|' + extraFrag;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; uniform float uTime;
        float gh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float gn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
          return mix(mix(gh(i), gh(i + vec2(1., 0.)), f.x), mix(gh(i + vec2(0., 1.)), gh(i + vec2(1., 1.)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float gg = gn(vWPos.xz * ${scale.toFixed(3)}) * 0.55 + gn(vWPos.xz * ${(scale * 4.3).toFixed(3)}) * 0.45;
        diffuseColor.rgb *= ${(1 - amt / 2).toFixed(3)} + ${amt.toFixed(3)} * gg;
        ${extraFrag}`);
  };
  return mat;
}

function buildTerrain() {
  const N = 300, HALF = 900;
  const warp = (u) => Math.sign(u) * (0.3 * Math.abs(u) + 0.7 * Math.abs(u) ** 3) * HALF;
  const cnt = (N + 1) * (N + 1);
  const pos = new Float32Array(cnt * 3), col = new Float32Array(cnt * 3), dist = new Float32Array(cnt);
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const k = j * (N + 1) + i;
    const x = warp(i / N * 2 - 1), z = warp(j / N * 2 - 1);
    const d = Math.abs(x) < 140 && Math.abs(z) < 120 ? roadDist(x, z) : 99;
    const hn = naturalHeight(x, z);
    pos[k * 3] = x; pos[k * 3 + 1] = lerp(-0.06, hn, smooth(ROAD_HALF + 0.5, ROAD_HALF + 13, d)); pos[k * 3 + 2] = z;
    dist[k] = d;
  }
  const idx = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const nor = geo.attributes.normal.array;
  const C = (h) => new THREE.Color(h);
  const sand = C('#e6d3a3'), wet = C('#b9a274'), seabed = C('#a39367'), deep = C('#5d6b62');
  const gA = C('#5f8a3a'), gB = C('#88a548'), dry = C('#b7ab62'), rock = C('#8d8a82'), gravel = C('#a8977a'), mtn = C('#5d7552');
  const tmp = new THREE.Color();
  for (let k = 0; k < cnt; k++) {
    const x = pos[k * 3], y = pos[k * 3 + 1], z = pos[k * 3 + 2], ny = nor[k * 3 + 1], d = dist[k];
    const dz = z - shoreZ(x);
    const n1 = fbm(x * 0.05, z * 0.05, 3), n2 = fbm(x * 0.013 + 7, z * 0.013, 3);
    tmp.copy(gA).lerp(gB, smooth(0.35, 0.65, n1));
    tmp.lerp(dry, smooth(0.5, 0.72, n2) * 0.75);
    tmp.lerp(mtn, smooth(300, 700, Math.hypot(x, z)));
    tmp.lerp(sand, 1 - smooth(7, 15, dz + (n1 - 0.5) * 6));
    if (y < WATER_Y + 0.35) tmp.lerp(wet, smooth(WATER_Y + 0.35, WATER_Y + 0.05, y));
    if (y < WATER_Y) tmp.copy(seabed).lerp(deep, smooth(WATER_Y - 0.5, WATER_Y - 5, y));
    tmp.lerp(rock, smooth(0.86, 0.7, ny) * (y > WATER_Y ? 1 : 0.3));
    const lh = Math.hypot(x - LH.x, z - LH.z);
    const hl = Math.exp(-(lh * lh) / (2 * 19 * 19));
    tmp.lerp(tmp.clone().copy(gB).lerp(dry, 0.55), hl * smooth(WATER_Y + 0.6, WATER_Y + 2.4, y));
    tmp.lerp(rock, clamp(hl * smooth(WATER_Y - 0.6, WATER_Y + 0.8, y) * (1 - smooth(WATER_Y + 1.6, WATER_Y + 3.6, y)) * 0.9 + smooth(0.85, 0.62, ny) * hl * 0.7, 0, 1));
    if (d < ROAD_HALF + 0.9) tmp.lerp(gravel, smooth(ROAD_HALF + 0.9, ROAD_HALF + 0.3, d));
    col[k * 3] = tmp.r; col[k * 3 + 1] = tmp.g; col[k * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = addGrain(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0 }), 1.7, 0.26, `
        float wl = ${WATER_Y.toFixed(2)} + 0.07 + 0.07 * sin(uTime * 0.9 + vWPos.x * 0.21) + 0.04 * sin(uTime * 1.7 - vWPos.x * 0.53);
        float foam = smoothstep(0.11, 0.0, abs(vWPos.y - wl)) * (0.55 + 0.45 * gn(vWPos.xz * 3.0 + uTime * 0.6));
        diffuseColor.rgb *= mix(1.0, 0.8, smoothstep(wl + 0.4, wl, vWPos.y));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.96, 0.98, 1.0), foam * 0.85);`);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------- 路面与标线 ---------- */
function ribbonGeo(offsetA, offsetB, y, step = 0.8, dash = null) {
  if (offsetA > offsetB) [offsetA, offsetB] = [offsetB, offsetA];
  const pos = [], idx = [];
  const n = Math.ceil(ROAD_LEN / step), smp = {};
  let v = 0, prevDash = -1;
  for (let i = 0; i <= n; i++) {
    const s = (i / n) * ROAD_LEN;
    let di = 0;
    if (dash) { const per = dash[0] + dash[1]; if (s % per > dash[0]) continue; di = Math.floor(s / per); }
    roadSample(s, smp);
    const nx = -Math.sin(smp.h), nz = -Math.cos(smp.h);   // 左侧法线（车身 -Z 为左）
    pos.push(smp.x + nx * offsetA, y, smp.z + nz * offsetA, smp.x + nx * offsetB, y, smp.z + nz * offsetB);
    if (v > 0 && (!dash || di === prevDash)) idx.push(v - 2, v, v - 1, v - 1, v, v + 1);
    prevDash = di;
    v += 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  // 统一法线朝上
  const nn = g.attributes.normal; for (let i = 0; i < nn.count; i++) nn.setXYZ(i, 0, 1, 0);
  return g;
}
const roadMat = addGrain(new THREE.MeshStandardMaterial({ color: 0x4d5257, roughness: 0.9, metalness: 0 }), 9, 0.35);

for (const side of [-1, 1]) {

}

/* =====================================================================
 *  海洋：Gerstner 波 + 深浅水颜色（基于地形高度纹理）+ 岸边泡沫 + 细碎波纹
 * ===================================================================== */
const HT_RES = 256, HT_MIN = -330, HT_MAX = 330;
const heightTex = (() => {
  const data = new Uint8Array(HT_RES * HT_RES * 4);
  for (let j = 0; j < HT_RES; j++) for (let i = 0; i < HT_RES; i++) {
    const x = HT_MIN + (i + 0.5) / HT_RES * (HT_MAX - HT_MIN), z = HT_MIN + (j + 0.5) / HT_RES * (HT_MAX - HT_MIN);
    const h = clamp(naturalHeight(x, z), -9, 3);
    const v = Math.round((h + 9) / 12 * 255), k = (j * HT_RES + i) * 4;
    data[k] = v; data[k + 1] = v; data[k + 2] = v; data[k + 3] = 255;
  }
  const t = new THREE.DataTexture(data, HT_RES, HT_RES, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
})();

function buildOcean() {
  const rings = 150, seg = 200, RMAX = 3200;
  const pos = [0, 0, 0], idx = [];
  for (let i = 1; i <= rings; i++) {
    const r = RMAX * (Math.pow(1.047, i) - 1) / (Math.pow(1.047, rings) - 1);
    for (let j = 0; j < seg; j++) { const a = j / seg * TAU; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); }
  }
  for (let j = 0; j < seg; j++) idx.push(0, 1 + ((j + 1) % seg), 1 + j);
  for (let i = 0; i < rings - 1; i++) for (let j = 0; j < seg; j++) {
    const a = 1 + i * seg + j, b = 1 + i * seg + ((j + 1) % seg), c = a + seg, d = b + seg;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setIndex(idx);
  const mat = new THREE.MeshStandardMaterial({ color: 0x0f4c74, roughness: 0.07, metalness: 0.0 });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, {
      uTime, uHeightTex: { value: heightTex },
      uShallow: { value: new THREE.Color('#33c3c0') }, uDeep: { value: new THREE.Color('#0b3f66') },
    });
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
      uniform float uTime; uniform sampler2D uHeightTex;
      varying float vDepth; varying vec3 vWPos; varying float vCrest;
      vec3 gerstner(vec2 dir, float steep, float wl, vec2 p, inout vec3 tg, inout vec3 bn) {
        float k = 6.28318 / wl; float c = sqrt(9.8 / k);
        vec2 d = normalize(dir); float f = k * (dot(d, p) - c * uTime); float a = steep / k;
        float s = sin(f), co = cos(f);
        tg += vec3(-d.x * d.x * steep * s, d.x * steep * co, -d.x * d.y * steep * s);
        bn += vec3(-d.x * d.y * steep * s, d.y * steep * co, -d.y * d.y * steep * s);
        return vec3(d.x * a * co, a * s, d.y * a * co);
      }`)
      .replace('#include <beginnormal_vertex>', `
        vec2 wp = position.xz;
        vec2 huv = (wp - ${HT_MIN.toFixed(1)}) / ${(HT_MAX - HT_MIN).toFixed(1)};
        float hgt = texture2D(uHeightTex, huv).r * 12.0 - 9.0;
        float depth = ${WATER_Y.toFixed(2)} - hgt;
        float att = clamp(depth / 3.5, 0.06, 1.0) * (1.0 - smoothstep(900.0, 2600.0, length(wp)) * 0.7);
        vec3 tg = vec3(1.0, 0.0, 0.0), bn = vec3(0.0, 0.0, 1.0), disp = vec3(0.0);
        disp += gerstner(vec2(0.25, 1.0), 0.11 * att, 21.0, wp, tg, bn);
        disp += gerstner(vec2(-0.45, 1.0), 0.09 * att, 11.0, wp, tg, bn);
        disp += gerstner(vec2(0.8, 0.7), 0.07 * att, 6.3, wp, tg, bn);
        disp += gerstner(vec2(-0.9, 0.35), 0.05 * att, 3.7, wp, tg, bn);
        vec3 objectNormal = normalize(cross(bn, tg));
        vDepth = depth; vCrest = disp.y;
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3(tangent.xyz);
        #endif`)
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position) + disp;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform float uTime; uniform vec3 uShallow, uDeep;
      varying float vDepth; varying vec3 vWPos; varying float vCrest;
      float oh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float on(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(oh(i), oh(i + vec2(1., 0.)), f.x), mix(oh(i + vec2(0., 1.)), oh(i + vec2(1., 1.)), f.x), f.y); }
      float rip(vec2 p){ return on(p * 0.9 + vec2(uTime * 0.31, uTime * 0.17)) + 0.5 * on(p * 2.3 - vec2(uTime * 0.23, -uTime * 0.41)); }
      float oFoam;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb = mix(uShallow, uDeep, smoothstep(0.0, 5.5, vDepth));
        float sf = smoothstep(0.3, 0.02, vDepth + 0.07 * sin(uTime * 1.25 + vWPos.x * 0.13 + vWPos.z * 0.05));
        float fn = on(vWPos.xz * 1.4 + vec2(uTime * 0.2, uTime * 0.35));
        oFoam = clamp(sf * (0.4 + 0.8 * fn) + smoothstep(0.18, 0.32, vCrest) * fn * 0.35, 0.0, 1.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.96, 0.97), oFoam);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.85, oFoam);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float e = 0.15; vec2 rp = vWPos.xz;
          float n0 = rip(rp), nx = rip(rp + vec2(e, 0.0)), nz = rip(rp + vec2(0.0, e));
          float fade = smoothstep(160.0, 15.0, distance(vWPos, cameraPosition)) * (1.0 - oFoam);
          vec3 rw = vec3(-(nx - n0) / e, 0.0, -(nz - n0) / e) * 0.16 * fade;
          normal = normalize(normal + (viewMatrix * vec4(rw, 0.0)).xyz);
        }`);
  };
  const mesh = new THREE.Mesh(g, mat);
  mesh.position.y = WATER_Y;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

/* =====================================================================
 *  天空：渐变 + 太阳光晕 + 星空 + 月亮；昼夜光照

    if (y > 45 || y < WATER_Y + 0.5) return;
    const sel = fbm(x * 0.017 + 40, z * 0.017, 2) + (rand() - 0.5) * 0.25;
    const o = { x, y: y - 0.05, z, ry: rand() * TAU, s: rr(0.8, 1.25) };
    if (sel < 0.43) pines.push(o); else if (sel < 0.56) { o.s = rr(0.85, 1.2); cyps.push(o); } else olives.push(o);
  };
  for (let i = 0; i < 260; i++) {           // 道路两侧
    const p = roadOffsetPoint(rand() * ROAD_LEN, (rand() < 0.5 ? -1 : 1) * rr(7, 34));
    if (fbm(p.x * 0.03, p.z * 0.03, 2) > 0.42) addTree(p.x, p.z);
  }
  for (let i = 0; i < 2600; i++) {          // 远处丘陵
    const x = rr(-260, 260), z = rr(-30, 260);
    if (fbm(x * 0.018 + 11, z * 0.018, 3) > 0.5) addTree(x, z);
  }
  // 海滨大道：棕榈与路灯交替排布在靠海一侧
  const lampSpots = [], benchSpots = [];
  for (let s = 0; s < ROAD_LEN; s += 11) {
    roadSample(s, _rs);
    if (_rs.z > -28) continue;
    const nz = -Math.cos(_rs.h), sgn = nz < 0 ? 1 : -1;     // 指向大海的一侧
    const sx = -Math.sin(_rs.h) * sgn, sz = nz * sgn;          // 朝海的水平法线
    const k = Math.round(s / 11);
    if (k % 2 === 0) lampSpots.push({ ...roadOffsetPoint(s, sgn * (ROAD_HALF + 0.9)), sx, sz });
    else {
      const p = roadOffsetPoint(s, sgn * (ROAD_HALF + 3.6));
      palms.push({ x: p.x, y: groundY(p.x, p.z) - 0.05, z: p.z, ry: rand() * TAU, s: rr(0.85, 1.15) });
      if (k % 6 === 3) benchSpots.push({ ...roadOffsetPoint(s + 4, sgn * (ROAD_HALF + 1.6)), sx, sz });
    }
  }
  for (let i = 0; i < 9; i++) {             // 沙滩上零星的棕榈
    const x = rr(-80, 70), z = shoreZ(x) + rr(5, 11);
    if (isFree(x, z, 6)) palms.push({ x, y: groundY(x, z) - 0.05, z, ry: rand() * TAU, s: rr(0.9, 1.25) });
  }
  // 草丛：集中在道路两侧，越近越密
  for (let i = 0; i < 6500; i++) {
    const near = i < 5200;
    let x, z;
    if (near) { const p = roadOffsetPoint(rand() * ROAD_LEN, (rand() < 0.5 ? -1 : 1) * (ROAD_HALF + 0.55 + 22 * rand() ** 1.7)); x = p.x; z = p.z; }
    else { x = rr(-120, 120); z = rr(-30, 110); }
    const dz = z - shoreZ(x);
    if (dz < 13 + rand() * 4) continue;
    if (roadDist(x, z) < ROAD_HALF + 0.45) continue;
    const y = groundY(x, z);
    const dryness = smooth(0.45, 0.75, fbm(x * 0.013 + 7, z * 0.013, 3));
    const c = new THREE.Color().setHSL(0.24 - dryness * 0.09 + rand() * 0.03, 0.45 - dryness * 0.1, 0.42 + rand() * 0.12);
    grass.push({ x, y: y - 0.02, z, ry: rand() * TAU, s: rr(0.7, 1.4), color: c.getHex() });
  }
  // 野花：成簇
  const flowerCols = ['#ff5b6e', '#ffd23f', '#ffffff', '#b07cff', '#ff8a3d', '#e84a5f', '#7ec8ff'];
  for (let c = 0; c < 150; c++) {
    const p = roadOffsetPoint(rand() * ROAD_LEN, (rand() < 0.5 ? -1 : 1) * rr(ROAD_HALF + 1.2, 18));
    if (p.z - shoreZ(p.x) < 14) continue;
    const col = pick(flowerCols), n = 6 + Math.floor(rand() * 14);
    for (let i = 0; i < n; i++) {
      const x = p.x + rr(-1.3, 1.3), z = p.z + rr(-1.3, 1.3);
      if (roadDist(x, z) < ROAD_HALF + 0.6) continue;
      flowers.push({ x, y: groundY(x, z) - 0.02, z, ry: rand() * TAU, s: rr(0.8, 1.3), color: col });
    }
  }
  scene.add(chunkedInstanced(umbrellaPineGeo(), vegMat, pines, { colorJitter: 0.25 }));
  scene.add(chunkedInstanced(cypressGeo(), vegMat, cyps, { colorJitter: 0.2 }));
  scene.add(chunkedInstanced(oliveTreeGeo(), vegMat, olives, { colorJitter: 0.25 }));
  scene.add(chunkedInstanced(palmGeo(), palmMat, palms, { colorJitter: 0.15 }));
  scene.add(chunkedInstanced(grassTuftGeo(), grassMat, grass, { cast: false }, 24));
  const fg = flowerGeos();
  scene.add(chunkedInstanced(fg.stem, flowerMat, flowers.map((f) => ({ ...f, color: undefined })), { cast: false }, 24));
  scene.add(chunkedInstanced(fg.head, flowerMat, flowers, { cast: false }, 24));
  return { lampSpots, benchSpots };
}

/* =====================================================================
 *  道具与建筑：村庄、风车、灯塔、栈桥、栅栏、路灯、长椅、遮阳伞、帆船、海鸥、云、远岛
 * ===================================================================== */
const boxG = (w, h, d, x, y, z, color, ry = 0) => placeGeo(tint(new THREE.BoxGeometry(w, h, d), color), x, y, z, 0, ry);
const HOUSES = [

];
const WINDMILL = { x: 58, z: 86 };
const PIER = { x: -22, z0: -52, z1: -94, y: 0.55 };
function registerBlockers() {
  for (const h of HOUSES) blockers.push({ x: h.x, z: h.z, r: Math.max(h.w, h.d) * 0.9 + 2 });
  blockers.push({ x: WINDMILL.x, z: WINDMILL.z, r: 7 }, { x: LH.x, z: LH.z, r: 12 }, { x: PIER.x, z: PIER.z0 + 6, r: 6 });
}

function buildProps(spots) {
  const world = { update: [] };
  const night = () => env.night;

  /* ---------- 村庄 ---------- */
  const houseParts = [], litWin = [], darkWin = [];
  HOUSES.forEach((H, idx) => {
    const y0 = Math.min(groundY(H.x - H.w / 2, H.z), groundY(H.x + H.w / 2, H.z), groundY(H.x, H.z - H.d / 2), groundY(H.x, H.z + H.d / 2)) - 0.1;
    const parts = [];
    parts.push(boxG(H.w, H.h + 1.2, H.d, 0, (H.h - 1.2) / 2, 0, H.wall));
    const rs = new THREE.Shape(); const ow = H.w / 2 + 0.35, rh = H.w * 0.32;
    rs.moveTo(-ow, 0); rs.lineTo(ow, 0); rs.lineTo(0, rh); rs.closePath();
    const roof = new THREE.ExtrudeGeometry(rs, { depth: H.d + 0.5, bevelEnabled: false });
    roof.translate(0, H.h, -(H.d + 0.5) / 2);
    parts.push(tint(roof, H.roof));
    parts.push(boxG(H.w + 0.12, 0.18, H.d + 0.12, 0, H.h, 0, '#d8cfc0'));
    parts.push(boxG(0.6, 1.4, 0.6, H.w * 0.25, H.h + rh * 0.6, H.d * 0.15, H.wall));
    parts.push(boxG(0.95, 2.0, 0.08, -H.w * 0.18, 1.0, -H.d / 2 - 0.03, '#6b4a33'));
    parts.push(boxG(1.15, 0.12, 0.3, -H.w * 0.18, 2.06, -H.d / 2 - 0.12, '#d8cfc0'));
    const twoStory = H.h >= 4;
    const wins = [[H.w * 0.22, 1.5, -H.d / 2, 0], [H.w / 2, 1.6, 0, Math.PI / 2], [-H.w / 2, 1.6, 0, -Math.PI / 2]];
    if (twoStory) wins.push([-H.w * 0.18, H.h - 0.95, -H.d / 2, 0], [H.w * 0.22, H.h - 0.95, -H.d / 2, 0], [H.w / 2, H.h - 0.95, 0, Math.PI / 2]);
    wins.forEach((w, k) => {
      const [wx, wy, wz, wr] = w;
      const out = V3(Math.sin(wr), 0, -Math.cos(wr));   // 外法线（局部）
      if (wr === 0) out.set(0, 0, -1);
      const fx = wx + out.x * 0.02, fz = wz + out.z * 0.02;
      parts.push(boxG(0.95, 1.1, 0.06, fx, wy, fz, '#f7f4ee', wr));
      if (wr === 0) {
        parts.push(boxG(0.38, 1.05, 0.05, fx - 0.68, wy, fz - 0.02, H.sh, wr));
        parts.push(boxG(0.38, 1.05, 0.05, fx + 0.68, wy, fz - 0.02, H.sh, wr));
      }
      const target = (hash2(idx, k) < 0.6) ? litWin : darkWin;
      target.push({ lx: wx + out.x * 0.05, ly: wy, lz: wz + out.z * 0.05, ry: wr });
    });
    // 门前花盆
    parts.push(boxG(0.5, 0.35, 0.5, -H.w * 0.18 + 0.85, 0.17, -H.d / 2 - 0.45, '#b5603d'));
    parts.push(blob(0.32, 1, 0.8, 1, -H.w * 0.18 + 0.85, 0.55, -H.d / 2 - 0.45, '#d84a6a', idx * 3 + 1, 1));
    const g = mergeGeos(parts);
    placeGeo(g, H.x, y0, H.z, 0, H.ry);
    houseParts.push(g);
    const ch = Math.cos(H.ry), sh = Math.sin(H.ry);
    for (const list of [litWin, darkWin]) for (const w of list) if (!w.done) {
      w.x = H.x + w.lx * ch + w.lz * sh; w.z = H.z - w.lx * sh + w.lz * ch; w.y = y0 + w.ly; w.ry = H.ry + w.ry; w.done = true;
    }
  });
  const houses = new THREE.Mesh(mergeGeos(houseParts), M.vcol);
  houses.castShadow = true; houses.receiveShadow = true;
  scene.add(houses);
  const winGeo = new THREE.BoxGeometry(0.72, 0.85, 0.05);
  const litWinMat = new THREE.MeshStandardMaterial({ color: 0x3a4655, roughness: 0.25, metalness: 0.2, emissive: 0xffb35c, emissiveIntensity: 0 });
  const darkWinMat = new THREE.MeshStandardMaterial({ color: 0x33404e, roughness: 0.2, metalness: 0.3 });
  scene.add(instanced(winGeo, litWinMat, litWin, { cast: false }), instanced(winGeo, darkWinMat, darkWin, { cast: false }));

  /* ---------- 风车 ---------- */
  {
    const y0 = groundY(WINDMILL.x, WINDMILL.z) - 0.3;
    const prof = []; for (let i = 0; i <= 10; i++) { const t = i / 10; prof.push(new THREE.Vector2(lerp(2.6, 1.7, t), t * 9)); }
    const parts = [tint(new THREE.LatheGeometry(prof, 24), '#f3efe6')];
    parts.push(tint(new THREE.ConeGeometry(2.05, 2.3, 24).translate(0, 10.1, 0), '#8a5a3c'));
    parts.push(boxG(1.0, 1.9, 0.1, 0, 0.95, -2.62, '#6b4a33'));
    parts.push(boxG(0.7, 0.8, 0.1, 0, 5.5, -2.15, '#45586a'));
    const tower = new THREE.Mesh(mergeGeos(parts), M.vcol);
    tower.position.set(WINDMILL.x, y0, WINDMILL.z); tower.castShadow = true; tower.receiveShadow = true;
    scene.add(tower);
    const sails = [];
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU;
      const blade = [boxG(0.22, 7.2, 0.16, 0, 3.7, 0, '#6b4a33')];
      for (let j = 0; j < 7; j++) blade.push(boxG(1.5, 0.07, 0.05, 0.75, 1.4 + j * 0.9, 0.04, '#e9e2d2'));
      blade.push(boxG(0.06, 6.4, 0.05, 1.5, 4.1, 0.04, '#6b4a33'));
      blade.push(placeGeo(tint(new THREE.PlaneGeometry(1.4, 6.2), '#f4efe2'), 0.75, 4.1, 0.07));
      const bg = mergeGeos(blade); placeGeo(bg, 0, 0, 0, 0, 0, a);
      sails.push(bg);
    }
    sails.push(tint(new THREE.CylinderGeometry(0.35, 0.35, 0.6, 12).rotateX(Math.PI / 2), '#5a3d2a'));
    const rotor = new THREE.Mesh(mergeGeos(sails), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, side: THREE.DoubleSide }));
    rotor.castShadow = true;
    const hub = new THREE.Group();
    hub.position.set(WINDMILL.x, y0 + 9.6, WINDMILL.z - 2.3);
    hub.add(rotor); scene.add(hub);
    world.update.push((dt) => { rotor.rotation.z -= dt * 0.55 * uWind.value; });

  /* ---------- 灯塔 ---------- */
  {
    const y0 = groundY(LH.x, LH.z) - 0.4;

    const tower = new THREE.LatheGeometry(prof, 36);
    { const p = tower.attributes.position, col = new Float32Array(p.count * 3), red = new THREE.Color('#c5352b'), wht = new THREE.Color('#f5f2ea');
      for (let i = 0; i < p.count; i++) { const c = (Math.floor(p.getY(i) / 2.7 + 0.001) % 2) ? red : wht; col.set([c.r, c.g, c.b], i * 3); }
      tower.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
    const parts = [tower];
    parts.push(tint(new THREE.CylinderGeometry(2.05, 1.6, 0.35, 36).translate(0, 13.6, 0), '#3b3f45'));
    parts.push(tint(new THREE.TorusGeometry(1.95, 0.04, 6, 48).rotateX(Math.PI / 2).translate(0, 14.6, 0), '#2b2f35'));
    for (let k = 0; k < 18; k++) { const a = k / 18 * TAU; parts.push(tint(cylGeo(V3(Math.cos(a) * 1.95, 13.75, Math.sin(a) * 1.95), V3(Math.cos(a) * 1.95, 14.6, Math.sin(a) * 1.95), 0.025, 0.025, 4), '#2b2f35')); }
    parts.push(tint(new THREE.CylinderGeometry(1.15, 1.15, 0.3, 24).translate(0, 13.9, 0), '#3b3f45'));
    parts.push(tint(new THREE.ConeGeometry(1.35, 1.3, 24).translate(0, 16.35, 0), '#c5352b'));
    parts.push(tint(new THREE.SphereGeometry(0.2, 10, 8).translate(0, 17.1, 0), '#2b2f35'));
    parts.push(boxG(4.4, 3.0, 5.0, 4.2, 1.2, 1.5, '#f2ece0'));

    parts.push(tint(new THREE.ExtrudeGeometry(rs, { depth: 5.4, bevelEnabled: false }).translate(0, 2.7, -2.7).rotateY(0).translate(4.2, 0, 1.5), '#a64a35'));
    const lh = new THREE.Mesh(mergeGeos(parts), M.vcol);
    lh.position.set(LH.x, y0, LH.z); lh.castShadow = true; lh.receiveShadow = true;
    scene.add(lh);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0xfff4d0, roughness: 0.1, metalness: 0.1, emissive: 0xffd27a, emissiveIntensity: 0.2, transparent: true, opacity: 0.88 });
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 1.6, 24, 1, true), glassMat);
    glass.position.set(LH.x, y0 + 14.85, LH.z); scene.add(glass);
    const beamLen = 70;
    const beamGeo = new THREE.ConeGeometry(5.5, beamLen, 32, 1, true).translate(0, -beamLen / 2, 0).rotateZ(Math.PI / 2);
    const beamMat = new THREE.ShaderMaterial({
      uniforms: { uI: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexShader: `varying float vL; varying vec3 vN; varying vec3 vV;
        void main(){ vL = position.x / ${beamLen.toFixed(1)}; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform float uI; varying float vL; varying vec3 vN; varying vec3 vV;
        void main(){ float f = pow(abs(dot(vN, vV)), 1.6); float a = pow(1.0 - clamp(vL, 0.0, 1.0), 1.7) * f * uI;

    const beam = new THREE.Group();

      const n = night();
      beam.visible = n > 0.02;
      beam.rotation.y += dt * 0.9;
      beamMat.uniforms.uI.value = n * 0.32;
      glassMat.emissiveIntensity = 0.2 + n * 7;
    });
  }

  /* ---------- 栈桥 ---------- */
  {
    const planks = [], posts = [];
    for (let z = PIER.z0; z > PIER.z1; z -= 0.3) planks.push({ x: PIER.x + (hash2(z * 10, 3) - 0.5) * 0.04, y: PIER.y, z, s: 1, ry: (hash2(z * 10, 5) - 0.5) * 0.02 });

      const by = Math.min(groundY(PIER.x + sx, z), WATER_Y) - 0.5;

    scene.add(instanced(new THREE.BoxGeometry(2.6, 0.07, 0.26), new THREE.MeshStandardMaterial({ color: 0x9b7653, roughness: 0.9 }), planks, { colorJitter: 0.2 }));
    scene.add(instanced(new THREE.CylinderGeometry(0.12, 0.13, 1, 8).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ color: 0x6d5038, roughness: 0.95 }), posts));
    const rails = [];

  /* ---------- 栅栏（北侧路段外沿） ---------- */
  {
    const posts = [], rails = [];
    let prev = null;
    for (let s = 0; s < ROAD_LEN; s += 2.6) {
      roadSample(s, _rs);
      if (_rs.z < 34) { prev = null; continue; }
      const sgn = -Math.cos(_rs.h) > 0 ? 1 : -1;
      const p = roadOffsetPoint(s, sgn * (ROAD_HALF + 1.5));
      const y = groundY(p.x, p.z);
      posts.push({ x: p.x, y: y - 0.1, z: p.z, ry: p.h });
      if (prev) {
        const dx = p.x - prev.x, dz = p.z - prev.z, len = Math.hypot(dx, dz), ry = Math.atan2(-dz, dx);
        for (const hy of [0.45, 0.8]) rails.push({ x: (p.x + prev.x) / 2, y: (y + prev.y) / 2 + hy, z: (p.z + prev.z) / 2, ry, sx: len });

      prev = { x: p.x, z: p.z, y };
    }
    const wood = new THREE.MeshStandardMaterial({ color: 0x8f6e4e, roughness: 0.92 });
    scene.add(instanced(new THREE.BoxGeometry(0.09, 1.05, 0.09).translate(0, 0.52, 0), wood, posts, { colorJitter: 0.15 }));
    scene.add(instanced(new THREE.BoxGeometry(1, 0.07, 0.04), wood, rails, { colorJitter: 0.12 }));
  }

  /* ---------- 路灯 + 地面光斑 ---------- */
  {
    const poleParts = [tint(cylGeo(V3(0, 0, 0), V3(0, 4.1, 0), 0.07, 0.05, 10), '#2e3b3a'),
      tint(cylGeo(V3(0, 0, 0), V3(0, 0.4, 0), 0.13, 0.1, 10), '#2e3b3a')];
    const arm = new THREE.CatmullRomCurve3([V3(0, 3.9, 0), V3(0, 4.35, -0.25), V3(0, 4.4, -0.8), V3(0, 4.25, -1.15)]);
    poleParts.push(tint(new THREE.TubeGeometry(arm, 12, 0.035, 6), '#2e3b3a'));
    poleParts.push(tint(new THREE.ConeGeometry(0.26, 0.28, 12, 1, true).translate(0, 4.13, -1.15), '#2e3b3a'));
    const poleGeo = mergeGeos(poleParts);
    const bulbGeo = new THREE.SphereGeometry(0.12, 12, 8).translate(0, 3.98, -1.15);
    const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff1d6, emissive: 0xffc87a, emissiveIntensity: 0.1, roughness: 0.3 });
    const lamps = spots.lampSpots.map((p) => ({ x: p.x, y: groundY(p.x, p.z) - 0.05, z: p.z, ry: Math.atan2(p.sx, p.sz) }));
    scene.add(instanced(poleGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0.6 }), lamps));
    scene.add(instanced(bulbGeo, bulbMat, lamps, { cast: false }));
    const poolMat = new THREE.ShaderMaterial({
      uniforms: { uI: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',

  {

  /* ---------- 帆船 ---------- */
  {

    });
    {

      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.Float32BufferAttribute([0.25, 0.8, 0, 0.25, 7.4, 0, -2.3, 0.85, 0, 0.4, 0.9, 0, 0.4, 6.9, 0, 2.6, 0.55, 0], 3));

      boats.push({ g, cx: rr(-260, 260), cz: rr(-330, -150), r: rr(60, 160), w: rr(0.006, 0.012) * (k % 2 ? 1 : -1), ph: rand() * TAU });
    }
    world.update.push((dt, t) => {
      for (const b of boats) {

        b.g.position.set(b.cx + Math.cos(a) * b.r, WATER_Y + 0.05 + Math.sin(t * 0.9 + b.ph) * 0.12, b.cz + Math.sin(a) * b.r);
        const vx = -Math.sin(a) * b.w, vz = Math.cos(a) * b.w;

  /* ---------- 海鸥 ---------- */
  {
    const white = new THREE.MeshStandardMaterial({ color: 0xf6f6f2, roughness: 0.8 });
    const grey = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.8, side: THREE.DoubleSide });
    const bodyGeo = loftGeo(12, 8, (t) => V3(lerp(-0.28, 0.24, t), 0, 0), V3(0, 1, 0), ellipse((t) => { const r = 0.065 * Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * t)), 0.7); return [r, r * 1.05, 0]; }));
    const wingGeo = (inner) => {
      const g = new THREE.BufferGeometry();
      const pts = inner ? [0.06, 0, 0, -0.1, 0, 0, -0.08, 0, 0.38, 0.05, 0, 0.38] : [0.05, 0, 0, -0.08, 0, 0, -0.16, 0, 0.42, -0.02, 0, 0.36];

    const gulls = [];

    }
    world.update.push((dt, t) => {
      for (const b of gulls) {
        const a = b.ph + t * b.w;
        const x = b.cx + Math.cos(a) * b.r, z = b.cz + Math.sin(a) * b.r;
        b.g.position.set(x, b.y + Math.sin(t * 0.5 + b.ph) * 1.5, z);
        const dir = Math.sign(b.w);
        b.g.rotation.set(0.35 * dir, Math.atan2(-Math.cos(a) * dir, -Math.sin(a) * dir), 0, 'YXZ');
        const cyc = (t * 0.4 + b.ph) % 4;
        const flap = cyc < 1.6 ? Math.sin(t * 9 + b.ph) : 0.15;
        for (const w of b.wings) { w.root.rotation.x = -w.s * flap * 0.55; w.outerP.rotation.x = -(flap * 0.35 - 0.1); }

  /* ---------- 云（扁平底的积云：多团噪声球体融合） ---------- */
  {
    const cloudMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, emissive: 0xffffff, emissiveIntensity: 0.08, fog: false });

    for (let k = 0; k < 16; k++) {

      for (let i = 0; i < n; i++) {
        const u = (i / (n - 1)) * 2 - 1;
        const cx = u * len + rr(-1, 1), cz = rr(-2.2, 2.2), r = (1.9 + rand() * 1.4) * (1 - 0.45 * Math.abs(u));

    world.update.push((dt) => {

  /* ---------- 远处的小岛 ---------- */
  for (const [x, z, s] of [[-520, -880, 1], [760, -1150, 1.4], [180, -1500, 0.8]]) {
    let g = new THREE.IcosahedronGeometry(1, 3); g.deleteAttribute('uv'); g.deleteAttribute('normal'); g = mergeVertices(g);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
      const n = 0.75 + 0.5 * fbm(vx * 2 + x, vz * 2 + z, 3);
      p.setXYZ(i, vx * 90 * s, Math.max(vy, -0.2) * 38 * s * n, vz * 70 * s);
    }
    g.computeVertexNormals();
    const isl = new THREE.Mesh(tint(g, '#5f7a55'), M.vcol);
    isl.position.set(x, WATER_Y - 2, z);

  return world;
}

/* =====================================================================
 *  自行车（局部坐标：+X 前进方向，+Y 向上，+Z 车身右侧；原点 = 后轮触地点）
 * ===================================================================== */
const BK = (() => {
  const R = 0.31, st = 72 * DEG, ha = 70 * DEG;
  const RA = V3(0, R, 0), BB = V3(0.40, 0.25, 0), FA = V3(0.96, R, 0);
  const dirST = V3(-Math.cos(st), Math.sin(st), 0), dirHT = V3(-Math.cos(ha), Math.sin(ha), 0);
  const perp = V3(Math.sin(ha), Math.cos(ha), 0);           // 垂直于转向轴、指向前方
  const P0 = FA.clone().addScaledVector(perp, -0.04);        // 转向轴上、与前轴等高附近的点
  const onAxis = (t) => P0.clone().addScaledVector(dirHT, t);
  return {
    R, tire: 0.021, RA, BB, FA, dirST, dirHT, P0, onAxis,
    wheelbase: FA.x - RA.x, crank: 0.13, pedalZ: 0.118, chainZ: 0.052,
    ringT: 38, cogT: 16, pitch: 0.0127,
    saddle: BB.clone().addScaledVector(dirST, 0.55),
  };
})();
BK.ratio = BK.ringT / BK.cogT;
BK.r1 = BK.ringT * BK.pitch / TAU;
BK.r2 = BK.cogT * BK.pitch / TAU;

function gearShape(N, rp, holeR) {
  const s = new THREE.Shape(), ro = rp + 0.0036, rt = rp - 0.0042;
  for (let i = 0; i < N; i++) {
    const a = (k) => ((i + k) / N) * TAU;
    const P = (r, k) => [Math.cos(a(k)) * r, Math.sin(a(k)) * r];
    const p0 = P(rt, 0), p1 = P(ro, 0.28), p2 = P(ro, 0.52), p3 = P(rt, 0.8);
    if (i === 0) s.moveTo(p0[0], p0[1]); else s.lineTo(p0[0], p0[1]);
    s.lineTo(p1[0], p1[1]); s.lineTo(p2[0], p2[1]); s.lineTo(p3[0], p3[1]);
  }
  s.closePath();
  const h = new THREE.Path(); h.absarc(0, 0, holeR, 0, TAU, true); s.holes.push(h);
  return s;
}

function buildBike() {
  const mat = {
    frame: new THREE.MeshPhysicalMaterial({ color: 0x2fa596, metalness: 0.35, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.06 }),

    copper: new THREE.MeshStandardMaterial({ color: 0xc98a4a, metalness: 1, roughness: 0.3 }),

  const root = new THREE.Group();

  const add = (m, parent = frame) => { m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  const { RA, BB, FA, dirST, onAxis } = BK;

  /* ---- 车架（钻石形） ---- */
  const stTop = BB.clone().addScaledVector(dirST, 0.40), htTop = onAxis(0.465), htBot = onAxis(0.335);
  const ttFront = onAxis(0.445), dtFront = onAxis(0.35);
  add(cylMesh(BB, stTop, 0.0145, 0.0145, mat.frame, 16));                       // 立管
  add(cylMesh(stTop, ttFront, 0.0135, 0.0135, mat.frame, 16));                  // 上管
  add(cylMesh(BB, dtFront, 0.0165, 0.0155, mat.frame, 16));                     // 下管
  add(cylMesh(htBot.clone().addScaledVector(BK.dirHT, -0.012), htTop.clone().addScaledVector(BK.dirHT, 0.012), 0.019, 0.019, mat.frame, 18)); // 头管
  for (const s of [-1, 1]) {
    add(cylMesh(V3(BB.x - 0.02, BB.y + 0.005, s * 0.024), V3(RA.x + 0.015, RA.y, s * 0.064), 0.0095, 0.0075, mat.frame, 10));     // 后下叉
    add(cylMesh(V3(stTop.x + 0.012, stTop.y - 0.025, s * 0.02), V3(RA.x + 0.01, RA.y + 0.012, s * 0.064), 0.0085, 0.0068, mat.frame, 10)); // 后上叉
    add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.006), mat.dark)).position.set(RA.x, RA.y, s * 0.066);                // 勾爪
  }
  for (const p of [stTop, htTop.clone().addScaledVector(BK.dirHT, 0.006), htBot]) add(new THREE.Mesh(new THREE.SphereGeometry(0.02, 14, 10), mat.frame)).position.copy(p);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.075, 16).rotateX(Math.PI / 2), mat.frame)).position.copy(BB);
  add(new THREE.Mesh(new THREE.SphereGeometry(0.019, 12, 8), mat.frame)).position.copy(stTop).addScaledVector(dirST, -0.01);
  // 后上叉桥 + 后闸
  const bridge = stTop.clone().lerp(RA, 0.3);
  add(cylMesh(V3(bridge.x, bridge.y, -0.035), V3(bridge.x, bridge.y, 0.035), 0.005, 0.005, mat.frame, 6));
  add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.1), mat.alloy)).position.set(bridge.x - 0.012, bridge.y - 0.005, 0);
  // 撑脚（收起）
  add(cylMesh(V3(BB.x - 0.06, BB.y - 0.01, -0.06), V3(RA.x + 0.12, RA.y - 0.09, -0.075), 0.007, 0.006, mat.alloy, 8));

  /* ---- 座管 + 皮革鞍座（带弹簧） ---- */
  const S = BK.saddle;
  add(cylMesh(stTop.clone().addScaledVector(dirST, -0.02), S.clone().addScaledVector(dirST, -0.045), 0.0118, 0.0118, mat.chrome, 14));
  const saddleGeo = loftGeo(26, 22, (t) => V3(S.x - 0.115 + t * 0.255, S.y - 0.012 + 0.006 * Math.sin(t * Math.PI) - 0.004 * t, 0), V3(0, 1, 0), (t, ang, out) => {
    const w = t < 0.18 ? lerp(0.07, 0.088, Math.sin(t / 0.18 * Math.PI / 2)) : lerp(0.088, 0.024, Math.pow((t - 0.18) / 0.82, 0.75));

  const saddle = add(new THREE.Mesh(saddleGeo, mat.leather));
  for (let k = 0; k < 7; k++) {

  }
  for (const s of [-1, 1]) {
    const hel = []; for (let i = 0; i <= 60; i++) { const a = i / 60 * TAU * 6; hel.push(V3(S.x - 0.085 + Math.cos(a) * 0.011, S.y - 0.09 + i / 60 * 0.055, s * 0.045 + Math.sin(a) * 0.011)); }
    add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hel), 120, 0.0021, 5), mat.chrome));
    add(cylMesh(V3(S.x - 0.085, S.y - 0.092, s * 0.045), V3(S.x + 0.1, S.y - 0.03, s * 0.012), 0.003, 0.003, mat.chrome, 6));
  }
  add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.022, 0.06), mat.chrome)).position.copy(S).addScaledVector(dirST, -0.06);
  // 后挡泥板 + 尾灯
  const fenderGeo = (a0, a1, rad) => {
    const pos = [], idx = [], NA = 40, NC = 8;
    for (let i = 0; i <= NA; i++) {
      const a = lerp(a0, a1, i / NA);
      for (let j = 0; j <= NC; j++) {
        const f = lerp(-1.15, 1.15, j / NC), r = rad + Math.cos(f) * 0.012;
        pos.push(Math.cos(a) * r, Math.sin(a) * r, Math.sin(f) * 0.032);

    }
    for (let i = 0; i < NA; i++) for (let j = 0; j < NC; j++) { const a = i * (NC + 1) + j, b = a + NC + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }

  const rl = add(new THREE.Mesh(new RoundedBoxGeometry(0.018, 0.035, 0.04, 2, 0.006), mat.rearLight));
  rl.position.set(RA.x + Math.cos(160 * DEG) * (BK.R + 0.04), RA.y + Math.sin(160 * DEG) * (BK.R + 0.04), 0);
  rl.rotation.z = -20 * DEG;

  /* ---- 车轮 ---- */
  function buildWheel() {

  for (const s of [1, -1]) {
    const W = { s };
    W.edge = new Loft(18, 14, true, true);
    W.edgeMesh = reg(new THREE.Mesh(W.edge.geo, featherMat)); W.edgeMesh.frustumCulled = false;
    tint(W.edge.geo, '#f6f3ec');
    W.edgePts = Array.from({ length: 18 }, () => V3());
    // 覆羽面片（肩-肘-腕三角区）
    const PN = 9;
    const pg = new THREE.BufferGeometry();
    const pcount = (PN + 1) * (PN + 2) / 2;
    pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pcount * 3), 3));
    const pidx = [];
    const rowStart = (i) => i * (PN + 1) - (i * (i - 1)) / 2;
    for (let i = 0; i < PN; i++) for (let j = 0; j < PN - i; j++) {
      const a = rowStart(i) + j, b = a + 1, c = rowStart(i + 1) + j;
      pidx.push(a, b, c);
      if (j < PN - i - 1) pidx.push(b, c + 1, c);
    }
    pg.setIndex(pidx);
    tint(pg, '#f4f1ea');
    W.patch = pg; W.PN = PN;
    W.patchMesh = reg(new THREE.Mesh(pg, plumeMat)); W.patchMesh.frustumCulled = false;
    W.dark = new THREE.InstancedMesh(darkFeather, plumeMat, NPRI + NSEC);
    W.white = new THREE.InstancedMesh(whiteFeather, plumeMat, NGC + NLC + NSCA + NALU);
    for (const im of [W.dark, W.white]) { im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false; im.userData.part = 'pelican'; parts.push(im); }
    const cc = new THREE.Color();
    for (let i = 0; i < NPRI + NSEC; i++) W.dark.setColorAt(i, cc.setScalar(0.9 + 0.1 * hash2(i, s + 5)));
    for (let i = 0; i < W.white.count; i++) W.white.setColorAt(i, cc.setScalar(0.94 + 0.06 * hash2(i, s + 9)));
    W.wrist = reg(new THREE.Mesh(new THREE.SphereGeometry(0.025, 14, 10), featherMat)); tint(W.wrist.geometry, '#f6f3ec');
    root.add(W.edgeMesh, W.patchMesh, W.dark, W.white, W.wrist);
    W.Sh = V3(); W.E = V3(); W.Wr = V3(); W.Ht = V3();
    wings[s] = W;
  }

  /* ---- 逐帧更新 ---- */
  const bodyM = new THREE.Matrix4();
  const toRoot = (local, out) => out.copy(local).applyMatrix4(bodyM);
  const tv = V3(), tv2 = V3(), tv3 = V3(), tq = new THREE.Quaternion(), tq2 = new THREE.Quaternion(), ZAX = V3(0, 0, 1), YAX = V3(0, 1, 0);
  const _fx = V3(), _fy = V3(), _fz = V3(), _fm = new THREE.Matrix4(), _fsc = V3();
  const setFeather = (im, i, at, dir, nrm, L, Wd, off) => {
    _fx.copy(dir).addScaledVector(nrm, -dir.dot(nrm)).normalize();
    _fz.crossVectors(_fx, nrm).normalize();
    _fy.crossVectors(_fz, _fx);
    _fm.makeBasis(_fx, _fy, _fz).scale(_fsc.set(L, Wd, Wd));
    _fm.setPosition(at.x + nrm.x * off, at.y + nrm.y * off, at.z + nrm.z * off);
    im.setMatrixAt(i, _fm);
  };
  const orientY = (mesh, a, b, sx, sz, side = ZAX) => {
    tv.subVectors(b, a);
    const len = tv.length();
    basisQuatY(tv, side, mesh.quaternion);
    mesh.position.copy(a);
    mesh.scale.set(sx, len, sz);
    return len;
  };
  const st = {
    headPos: V3(0.64, 1.47, 0), headBase: V3(), headQ: new THREE.Quaternion(), headE: new THREE.Euler(0, 0, 0, 'YXZ'),
    yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, lookTimer: 2,
    blinkT: 0, blinkNext: 3, jaw: 0, honkT: -1, yawnT: -1, idleT: 0,
    pouchY: 0, pouchV: 0, prevHW: V3(), prevVy: 0, hw: V3(),
    wave: 0, waveT: -1, waveSide: -1, lookCam: 0, lookCamT: 0, lookBasket: 0, lookBasketT: 0,
  };
  const handDir = V3(), nrm = V3(), up = V3(), fore = V3(), lead = V3(), sideN = V3(), pT = V3(), sT = V3(), cT = V3(), handS = V3(), trailS = V3(), nrmS = V3(), dirv = V3();

  function update(dt, ctx) {
    const { time, theta } = ctx;
    const sp = clamp(ctx.speed / 8, 0, 1), eff = ctx.effort;
    // 躯干：踩踏引起的起伏/摇摆 + 呼吸 + 速度越快越前倾

    body.rotation.set(0.028 * Math.sin(theta) * eff + ctx.lean * 0.12, 0.022 * Math.sin(theta) * eff, (18 - 4 * sp) * DEG + 0.01 * Math.sin(time * 1.3), 'YXZ');
    const br = Math.sin(time * 1.45);

    body.updateMatrix(); bodyM.copy(body.matrix);
    tail.rotation.set(0.04 * Math.sin(time * 7.3) * sp, 0.05 * Math.sin(time * 2.1 + 1), -0.05 + 0.03 * Math.sin(time * 9.1) * sp);

    /* 腿：髋 → 膝（向前弯）→ 踝（向后弯）→ 蹼足踩在脚踏上 */
    for (const s of [1, -1]) {
      const L = legs[s], P = ctx.pedal[s], beta = ctx.pedalPitch[s];
      const th = theta + (s === 1 ? 0 : Math.PI);
      toRoot(A.hip[s], L.H);
      const cb = Math.cos(-beta), sb = Math.sin(-beta);
      L.B.set(P.x - 0.02 * cb - 0.012 * sb, P.y - 0.02 * sb + 0.012 * cb, P.z - s * 0.004);
      const gam = (54 + 17 * Math.cos(th - 3.3)) * DEG, ang = Math.PI - gam - beta;
      L.A.set(L.B.x + LEG.tarsus * Math.cos(ang), L.B.y + LEG.tarsus * Math.sin(ang), L.B.z + (L.H.z - L.B.z) * 0.25);
      solveIK2(L.H, L.A, LEG.femur, LEG.tibio, tv3.set(1, 0.2, s * 0.32), L.K);
      orientY(L.femur, L.H, L.K, 1, 1);
      const lt = orientY(L.tibio, L.K, L.A, 1, 1);
      L.drum.quaternion.copy(L.tibio.quaternion);
      L.drum.position.copy(L.K); L.drum.scale.set(0.027, 0.027, 0.027);
      L.ankle.position.copy(L.A);
      orientY(L.tarsus, L.A, L.B, 1, 1);
      tq.setFromAxisAngle(ZAX, -beta); tq2.setFromAxisAngle(YAX, -s * 0.14);
      L.foot.quaternion.copy(tq).multiply(tq2);
      L.foot.position.copy(L.B);
    }

    /* 翅膀：收拢的翅膀贴着体侧，腕关节（翼角）勾在车把握把上；打招呼时一侧翅膀举起挥动 */
    if (st.waveT >= 0) {
      st.waveT += dt;
      const T = 2.6;
      st.wave = st.waveT < 0.35 ? smooth(0, 0.35, st.waveT) : st.waveT > T - 0.45 ? smooth(T, T - 0.45, st.waveT) : 1;
      if (st.waveT > T) { st.waveT = -1; st.wave = 0; }
    }
    for (const s of [1, -1]) {
      const W = wings[s], g = ctx.grip[s];
      toRoot(A.shoulder[s], W.Sh);
      const tgt = tv.set(g.x - 0.012, g.y + 0.032, g.z - s * 0.01);
      const spread = s === st.waveSide ? st.wave : 0;
      if (spread > 0) {
        const wt = time * 10;
        tv2.set(W.Sh.x + 0.14, W.Sh.y + 0.22 + 0.035 * Math.sin(wt), W.Sh.z + s * (0.3 + 0.07 * Math.sin(wt)));
        tgt.lerp(tv2, spread);
      }
      solveIK2(W.Sh, tgt, WING.hum, WING.fore, tv3.set(-1, -0.55 + spread * 0.9, s * (0.22 + spread * 0.5)), W.E);
      W.Wr.subVectors(tgt, W.E).normalize().multiplyScalar(WING.fore).add(W.E);
      fore.subVectors(W.Wr, W.E).normalize();
      // 体侧法线与汇聚点（根坐标）
      sideN.copy(A.side[s]).transformDirection(bodyM);
      toRoot(A.pri[s], pT); toRoot(A.sec[s], sT); toRoot(A.cov[s], cT);
      // 举翅挥手时的展开方向
      handS.copy(fore).add(up.set(0, 0.7, 0)).normalize();
      trailS.set(-1, -0.3, 0); trailS.addScaledVector(fore, -trailS.dot(fore)).normalize();
      nrmS.crossVectors(handS, trailS).normalize(); if (nrmS.z * s < 0) nrmS.negate();
      nrm.copy(sideN).lerp(nrmS, spread).normalize();
      handDir.subVectors(pT, W.Wr).normalize().lerp(handS, spread).normalize();
      W.Ht.copy(W.Wr).addScaledVector(handDir, WING.hand);
      const fdir = (target, root, dy, spreadDir) => dirv.subVectors(target, root).add(up.set(0, dy, 0)).normalize().lerp(spreadDir, spread).normalize();
      // 初级飞羽（黑）
      for (let i = 0; i < NPRI; i++) {
        const u = i / (NPRI - 1);
        tv2.lerpVectors(W.Ht, W.Wr, u * 0.92);
        tv3.copy(handS).multiplyScalar(1 - u * 0.6).addScaledVector(trailS, u * 0.9).normalize();
        fdir(pT, tv2, -0.06 * u, tv3);
        setFeather(W.dark, i, tv2, dirv, nrm, 0.43 - 0.06 * u, 0.056, 0.002 + 0.0011 * (NPRI - i));
      }
      // 次级飞羽（黑）
      for (let j = 0; j < NSEC; j++) {
        const u = (j + 0.5) / NSEC;
        tv2.lerpVectors(W.Wr, W.E, u);
        fdir(sT, tv2, -0.05 * (1 - u), trailS);
        setFeather(W.dark, NPRI + j, tv2, dirv, nrm, 0.28 + 0.03 * u, 0.06, 0.016 + 0.0009 * j);
      }
      W.dark.instanceMatrix.needsUpdate = true;
      // 大覆羽、小覆羽、肩羽、小翼羽（白）
      let k = 0;
      lead.subVectors(W.Sh, W.E).normalize();
      for (let j = 0; j < NGC; j++, k++) {
        const u = (j + 0.4) / NGC;
        tv2.lerpVectors(W.Wr, W.E, u).addScaledVector(lead, 0.03);
        fdir(cT, tv2, -0.02, trailS);
        setFeather(W.white, k, tv2, dirv, nrm, 0.15, 0.058, 0.028 + 0.0008 * j);
      }
      for (let j = 0; j < NLC; j++, k++) {
        const u = (j + 0.5) / NLC;
        tv2.lerpVectors(W.Wr, W.Sh, u * 0.85).lerp(tv3.lerpVectors(W.E, W.Sh, u), 0.35);
        fdir(cT, tv2, 0.02, trailS);
        setFeather(W.white, k, tv2, dirv, nrm, 0.1, 0.05, 0.036 + 0.0008 * j);
      }
      for (let j = 0; j < NSCA; j++, k++) {
        const u = (j + 0.5) / NSCA;
        tv2.lerpVectors(W.Sh, W.E, u * 0.8).addScaledVector(sideN, -0.012);
        fdir(pT, tv2, 0.05, trailS);
        setFeather(W.white, k, tv2, dirv, tv.copy(sideN).add(up.set(0, 0.8, 0)).normalize(), 0.21 - 0.03 * u, 0.065, 0.01);
      }
      for (let j = 0; j < NALU; j++, k++) {
        tv2.copy(W.Wr).addScaledVector(nrm, 0.012);
        tv3.set(1, -0.55 - j * 0.25, -s * 0.15).normalize();
        if (spread > 0) tv3.lerp(handS, spread).normalize();
        setFeather(W.white, k, tv2, tv3, tv.set(0.3, 0.6, s).normalize(), 0.06 - 0.008 * j, 0.03, 0.004 * j);
      }
      W.white.instanceMatrix.needsUpdate = true;
      // 前缘（肩→腕，扁平的翼膜，略向外鼓起）
      for (let i = 0; i < 18; i++) {
        const t = i / 17;
        W.edgePts[i].lerpVectors(W.Sh, W.Wr, t).addScaledVector(nrm, 0.015 * Math.sin(Math.PI * t)).add(up.set(0, 0.012 * Math.sin(Math.PI * t), 0));
      }
      W.edge.update(W.edgePts, nrm, ellipse((t) => [lerp(0.052, 0.026, t), lerp(0.028, 0.015, t)]));
      W.wrist.position.copy(W.Wr);
      // 覆羽面片：肩、肘、腕三角
      const pp = W.patch.attributes.position, PN = W.PN;
      let vi = 0;
      for (let i = 0; i <= PN; i++) for (let j = 0; j <= PN - i; j++) {
        const u = i / PN, v = j / PN, w = 1 - u - v;
        const bulge = 0.02 * (u * v + v * w + w * u) * 3 + 0.008;
        pp.setXYZ(vi++, W.Sh.x * w + W.E.x * u + W.Wr.x * v + nrm.x * bulge, W.Sh.y * w + W.E.y * u + W.Wr.y * v + nrm.y * bulge, W.Sh.z * w + W.E.z * u + W.Wr.z * v + nrm.z * bulge);
      }

    }

    /* 头部：鸟类的头部稳定（不随身体起伏）、转弯时看向弯内、视平线保持水平 */
    st.lookTimer -= dt;

      const far = rand() < 0.3;

      st.lookTimer = far ? rr(0.9, 1.6) : rr(1.8, 4.5);
      if (ctx.stopped && rand() < 0.35 && st.yawnT < 0) st.yawnT = 0;
    }
    let yawT = st.tYaw * (ctx.stopped ? 1 : 0.55) + clamp(ctx.turnK * 7, -0.5, 0.5), pitchT = st.tPitch;
    st.lookCamT = Math.max(0, st.lookCamT - dt); st.lookCam = damp(st.lookCam, st.lookCamT > 0 ? 1 : 0, 5, dt);
    st.lookBasketT = Math.max(0, st.lookBasketT - dt); st.lookBasket = damp(st.lookBasket, st.lookBasketT > 0 ? 1 : 0, 5, dt);
    if (st.lookCam > 0.001 && ctx.camLocal) {
      tv.subVectors(ctx.camLocal, st.headPos);
      const cy = clamp(Math.atan2(-tv.z, tv.x), -1.3, 1.3), cp = clamp(Math.atan2(tv.y, Math.hypot(tv.x, tv.z)) + 0.25, -0.5, 0.6);
      yawT = lerp(yawT, cy, st.lookCam); pitchT = lerp(pitchT, cp, st.lookCam);
    }
    if (st.lookBasket > 0.001) { yawT = lerp(yawT, 0, st.lookBasket); pitchT = lerp(pitchT, -0.55, st.lookBasket); }
    let yawnP = 0;
    if (st.yawnT >= 0) { st.yawnT += dt; const y = st.yawnT; yawnP = y < 0.6 ? smooth(0, 0.6, y) : y > 1.8 ? smooth(2.4, 1.8, y) : 1; if (y > 2.4) st.yawnT = -1; }
    pitchT += yawnP * 0.55;
    st.yaw = damp(st.yaw, yawT, 3.5, dt); st.pitch = damp(st.pitch, pitchT, 4, dt);
    st.headBase.set(0.675 + 0.02 * sp, 1.375 - 0.02 * sp, 0);
    st.headPos.copy(st.headBase).add(tv.set(-0.02 * Math.abs(st.yaw), 0.015 * st.pitch, -0.05 * Math.sin(st.yaw)));
    st.headE.set(-ctx.lean * 0.85, st.yaw, -0.3 + st.pitch, 'YXZ');
    st.headQ.setFromEuler(st.headE);
    head.position.copy(st.headPos); head.quaternion.copy(st.headQ);

    // 喙：打招呼时开合、打哈欠时张大；喉囊带弹簧晃动
    let jawT = yawnP * 0.75;
    if (st.honkT >= 0) {
      st.honkT += dt; const h = st.honkT;
      jawT = Math.max(jawT, 0.42 * Math.max(0, Math.sin(Math.min(h, 1.1) / 1.1 * Math.PI * 3)) * (h < 1.1 ? 1 : 0));
      if (h > 1.3) st.honkT = -1;
    }
    st.jaw = damp(st.jaw, jawT, 14, dt);
    jaw.rotation.z = -st.jaw;
    head.updateMatrixWorld();
    head.getWorldPosition(st.hw);
    if (!st.inited) { st.prevHW.copy(st.hw); st.inited = true; }
    const vy = (st.hw.y - st.prevHW.y) / Math.max(dt, 1e-3), ay = (vy - st.prevVy) / Math.max(dt, 1e-3);
    st.prevHW.copy(st.hw); st.prevVy = vy;
    if (dt > 0) {
      st.pouchV += (-180 * st.pouchY - 7 * st.pouchV - clamp(ay, -60, 60) * 0.012 + (jawT - st.jaw) * 4) * dt;
      st.pouchY = clamp(st.pouchY + st.pouchV * dt, -0.25, 0.3);
    }
    pouch.scale.set(1, 1 + st.pouchY + st.jaw * 0.35, 1 + st.pouchY * 0.3);
    // 眨眼
    st.blinkT += dt;
    const bk = st.blinkT > st.blinkNext ? smooth(0, 0.07, st.blinkT - st.blinkNext) * smooth(0.2, 0.12, st.blinkT - st.blinkNext) : 0;
    if (st.blinkT > st.blinkNext + 0.2) { st.blinkT = 0; st.blinkNext = rr(2.2, 5.5); }

    /* 颈部：从胸前到头后部的 S 形三次贝塞尔 */
    const P0 = toRoot(A.neck, tv);
    const bd = tv2.set(0.3, 1, 0).normalize().transformDirection(bodyM);
    const P3 = tv3.set(-0.028, -0.018, 0).applyQuaternion(st.headQ).add(st.headPos);
    const hd = up.set(0.62, 0.78, 0).applyQuaternion(st.headQ).normalize();
    const P1 = V3().copy(P0).addScaledVector(bd, 0.12), P2 = V3().copy(P3).addScaledVector(hd, -0.12);
    const P0b = V3().copy(P0).addScaledVector(bd, -0.05);
    const bodyFwd = lead.set(1, 0, 0).transformDirection(bodyM), headFwd = fore.set(1, 0, 0).applyQuaternion(st.headQ);
    for (let i = 0; i < NR; i++) {
      const t = i / (NR - 1), a = 1 - t;
      const p = neckPts[i];
      p.set(0, 0, 0).addScaledVector(P0b, a * a * a).addScaledVector(P1, 3 * a * a * t).addScaledVector(P2, 3 * a * t * t).addScaledVector(P3, t * t * t);
      neckUps[i].lerpVectors(bodyFwd, headFwd, smooth(0.1, 0.95, t)).normalize();
    }
    neckLoft.update(neckPts, neckUps, (t, ang, out) => {
      const r = t < 0.25 ? lerp(0.1, 0.072, smooth(0, 0.25, t)) : t < 0.7 ? lerp(0.072, 0.056, (t - 0.25) / 0.45) : lerp(0.056, 0.04, smooth(0.7, 1, t));
      const s = Math.sin(ang), c = Math.cos(ang);
      out[0] = c * r; out[1] = s * r * 1.12 + r * 0.12 * smooth(0.6, 1, t) * (s > 0 ? 1 : 0.3);
    });
  }

  return {
    root, body, head, jaw, pouch, legs, wings, parts, update, state: st,
    greet(side = -1) { st.waveSide = side; st.waveT = 0; st.honkT = 0; st.lookCamT = 2.6; },
    lookAtBasket() { st.lookBasketT = 1.8; st.honkT = 0.55; },
  };
}

addPicker(new THREE.SphereGeometry(0.11, 10, 8), pelican.head, V3(0, 0, 0), 'pelican');
addPicker(new THREE.BoxGeometry(0.45, 0.12, 0.09), pelican.head, V3(0.25, -0.04, 0), 'pelican');

/* =====================================================================
 *  骑行模拟
 * ===================================================================== */
const ride = {
  s: 40, v: 0, vTarget: 17 / 3.6, wheel: 0, crank: Math.PI / 2, crankW: 0, pedaling: true,
  lean: 0, steer: 0, dist: 0, effort: 0.5, turnK: 0, stopT: 0, wob: 0, lane: -0.85,
  timeScale: 1, paused: false, bellT: -1, x: 0, z: 0, h: 0,
};
const G = 9.81;
const smp = {}, smp2 = {};
const pedalPos = { 1: V3(), [-1]: V3() }, pedalPitch = { 1: 0, [-1]: 0 }, gripPos = { 1: V3(), [-1]: V3() };
const camLocal = V3();

function stepRide(dt, time) {
  // 速度：加速受限，减速时滑行（棘轮“咔嗒”声）
  const dv = ride.vTarget - ride.v;
  const acc = dv > 0 ? Math.min(dv, 1.4 * dt) : Math.max(dv, -(ride.vTarget < 0.1 ? 2.2 : 1.6) * dt);
  ride.v = Math.max(0, ride.v + acc);
  const v = ride.v;
  ride.s = (ride.s + v * dt) % ROAD_LEN;
  ride.dist += v * dt;
  roadSample(ride.s, smp);
  roadSample(ride.s + 5, smp2);

    hudT = 0.12;
    stSpeed.textContent = (ride.v * 3.6).toFixed(1);
    stCad.textContent = ride.pedaling ? Math.round(Math.abs(ride.crankW) * 60 / TAU) : 0;
    stLean.textContent = Math.round(Math.abs(ride.lean) / DEG);
    stDist.textContent = ride.dist < 1000 ? Math.round(ride.dist) : (ride.dist / 1000).toFixed(2) + 'k';
  }
  composer.render();

  // 自适应画质：帧时间持续偏高时逐级降低（分辨率 → 阴影贴图 → 泛光）
  fpsT += rdt; fpsN++;
  if (fpsT > 2) {
    const ms = fpsT / fpsN * 1000;
    lowFpsT = ms > 28 && !document.hidden ? lowFpsT + 1 : 0;
    if (lowFpsT >= 2 && adaptive.on) { degradeQuality(); lowFpsT = 0; }
    fpsT = 0; fpsN = 0;
  }
  if (firstFrame) {
    firstFrame = false;
    window.__appReady = true;
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 250);
  }
}
statusEl.textContent = '即将出发 …';
// 调试句柄（便于在控制台中试玩/截图）
window.__pelican = { THREE, scene, camera, controls, renderer, composer, bloomPass, sunLight, adaptive, ride, bike, pelican, cam, setCamMode, setSpeedKmh, interact,
  setHour: (h) => { hour = h; ui.tod.value = h; ui.todv.textContent = fmtHour(h); updateTimeOfDay(h, true); } };
requestAnimationFrame(frame);
</script>
</body>
